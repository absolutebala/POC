class Component extends DCLogic {
  renderVals() {
    var navItems = [
      ['Plant overview','index.html'],['Orders','orders.html'],['Process board','process-board.html'],['Shop floor','shop-floor.html'],
      ['Quality & wastage','quality.html'],['Capacity & resources','capacity.html'],['Data sources','data-sources.html']
    ];
    var active = 'Plant overview';
    var nav = navItems.map(function (n) {
      var on = n[0] === active;
      return { label: n[0], href: n[1], style: 'display:flex;align-items:center;min-height:44px;padding:0 12px;border-radius:6px;text-decoration:none;font-size:14px;' + (on ? 'background:#1C1C1A;color:#FFFFFF;font-weight:600' : 'color:#3A3A37') };
    });
    var badge = function (s) {
      var c = s === 'Behind' ? ['#FBE9E7','#A12A1C'] : s === 'At risk' ? ['#FDF0E1','#97470A'] : ['#E7F2EA','#2F6B45'];
      return 'font-size:12px;font-weight:600;padding:4px 8px;border-radius:999px;background:' + c[0] + ';color:' + c[1];
    };
    var plan = [80,80,80,80,80,60,0,80,80,80,80,80,60,0];
    var act  = [72,78,64,81,70,55,0,76,62,79,68,74,50,0];
    var days = plan.map(function (p, i) { return { plan: p + '%', actual: act[i] + '%' }; });
    var orders = [
      ['SO-[1042]','[Client A]','[22 Nov]','46%','1,120 units','[29 Nov]','Behind'],
      ['SO-[1038]','[Client B]','[25 Nov]','62%','640 units','[27 Nov]','Behind'],
      ['SO-[1051]','[Client C]','[28 Nov]','35%','380 units','[30 Nov]','At risk'],
      ['SO-[1047]','[Client A]','[02 Dec]','28%','210 units','[03 Dec]','At risk'],
      ['SO-[1055]','[Client D]','[05 Dec]','12%','90 units','[05 Dec]','At risk']
    ].map(function (r, i) {
      var notes = [
        'Machining head: CNC-03 back 19:00; needs Shift C',
        'Welding head: porosity rework, wire batch changed',
        'Cutting head: MS plate runs out tomorrow',
        'Machining head: queued behind SO-[1042]',
        'Cutting head: on plan'
      ];
      return { id: r[0], client: r[1], due: r[2], pct: r[3], behind: r[4], eta: r[5], status: r[6], badge: badge(r[6]), note: notes[i] };
    });
    var depts = [['Cutting',14,72],['Machining',22,108],['Welding',9,95],['Fabrication',11,84],['Painting',6,61],['Quality check',8,77],['Dispatch',4,40]]
      .map(function (d, i) {
        var hs = ['On track','Blocked','At risk','On track','Pending','On track','On track'][i];
        var hc = hs === 'Blocked' ? ['#FBE9E7','#A12A1C'] : hs === 'At risk' ? ['#FDF0E1','#97470A'] : hs === 'Pending' ? ['#F0F0EC','#3A3A37'] : ['#E7F2EA','#2F6B45'];
        return { name: d[0], wip: d[1], load: d[2] + '%', bar: Math.min(d[2],100) + '%', color: d[2] > 100 ? '#C2410C' : d[2] > 90 ? '#D97706' : '#2459D6',
          hstatus: hs, hbadge: 'font-size:11px;font-weight:600;padding:2px 6px;border-radius:999px;background:' + hc[0] + ';color:' + hc[1] };
      });
    var srcStyle = function (s) {
      var c = s === 'Dept head' ? ['#EEF3FD','#1A43A6'] : s === 'iDataOne' ? ['#1C1C1A','#FFFFFF'] : ['#F0F0EC','#3A3A37'];
      return 'font-size:10px;font-weight:600;padding:2px 6px;border-radius:4px;background:' + c[0] + ';color:' + c[1];
    };
    var mcol = { Running: '#2F7D4F', Idle: '#B8B8B2', Down: '#B42318' };
    var machines = [['CNC-01','Running','86%'],['CNC-02','Running','79%'],['CNC-03','Down','0% · 42 min'],['Laser-01','Running','91%'],['Press-02','Idle','34%'],['Weld-R1','Running','74%'],['Weld-R2','Down','0% · 15 min'],['Paint-L1','Running','68%']]
      .map(function (m) { return { name: m[0], state: m[1], util: m[2], color: mcol[m[1]] }; });
    return {
      nav: nav,
      kpis: [
        { label: 'Output today vs plan', value: '88%', sub: '[1,840] of [2,100] units', tone: '#97470A', src: 'SAP + IoT + head confirmations' },
        { label: 'OEE (plant)', value: '71%', sub: 'Avail 84 · Perf 89 · Qual 95', tone: '#5E5E5A', src: 'IoT + head downtime reasons' },
        { label: 'Orders behind', value: '6 / 24', sub: '3 more at risk', tone: '#A12A1C', src: 'iDataOne forecast (SAP dates + head commitments)' },
        { label: 'Wastage (scrap)', value: '3.2%', sub: 'Target ≤ 2.5%', tone: '#A12A1C', src: 'SAP scrap + head-reported scrap' },
        { label: 'Defect rate', value: '1.8%', sub: 'Rework 1.1% · Reject 0.7%', tone: '#5E5E5A', src: 'SAP QM + head quality reports' },
        { label: 'Extra hours needed', value: '142 h', sub: 'To recover this week', tone: '#97470A', src: 'iDataOne calc + head requests' },
        { label: 'Open blockers', value: '5', sub: '3 approvals waiting on you', tone: '#A12A1C', src: 'Dept head app' }
      ],
      days: days,
      alerts: [
        { level: 'APPROVE', tone: '#1A43A6', text: 'Shift C for Machining (4 operators × 3 nights)', meta: 'Machining head · 18:05 · recovers ~60 h', src: 'Dept head' },
        { level: 'CRITICAL', tone: '#A12A1C', text: 'CNC-03 down — spindle overheat', meta: '42 min · head says back by 19:00', src: 'IoT' },
        { level: 'CRITICAL', tone: '#A12A1C', text: 'MS plate 6 mm runs out by morning', meta: 'Stock 0.9 t vs 2.4 t needed · Cutting head confirmed', src: 'SAP' },
        { level: 'APPROVE', tone: '#1A43A6', text: '2 contract welders for 4 days', meta: 'Welding head · 17:58', src: 'Dept head' },
        { level: 'WARNING', tone: '#97470A', text: 'SO-[1042] ETA slipped 2 days', meta: 'Forecast from run rate + head commitment', src: 'iDataOne' },
        { level: 'WARNING', tone: '#97470A', text: 'Machining scrap differs from SAP by 8 units', meta: 'Head confirmed 240 vs SAP 248', src: 'iDataOne' }
      ].map(function (a) { a.srcStyle = srcStyle(a.src); return a; }),
      orders: orders,
      depts: depts,
      pdepts: ['Cutting','Machining','Welding','Fabrication','Painting','Quality check','Dispatch'],
      prows: [
        ['SO-[1042]','D H P P P P N',[100,58,49,47,46,46,0]],
        ['SO-[1038]','D D R P P P N',[100,100,64,63,62,62,0]],
        ['SO-[1051]','R P P X P P N',[58,40,37,0,36,35,0]],
        ['SO-[1047]','D R P P P P N',[100,40,32,30,29,28,0]],
        ['SO-[1044]','D D D X D H N',[100,100,100,0,100,74,0]]
      ].map(function (r) {
        var look = {
          D: 'background:#E7F2EA;color:#2F6B45;border:1px solid #CFE5D6;',
          P: 'background:#EEF3FD;color:#1A43A6;border:1px solid #C9D7F5;',
          R: 'background:#EEF3FD;color:#97470A;border:2px solid #D97706;',
          H: 'background:#FBE9E7;color:#A12A1C;border:2px solid #B42318;',
          N: 'background:#fff;color:#5E5E5A;border:1px dashed #C4C4BF;',
          X: 'background:transparent;color:#6B6B66;border:1px solid transparent;'
        };
        return { id: r[0], cells: r[1].split(' ').map(function (c, i) {
          var label = c === 'D' ? 'Done' : c === 'H' ? 'On hold' : c === 'N' ? '—' : c === 'X' ? '' : c === 'R' ? r[2][i] + '% · risk' : r[2][i] + '%';
          return { label: label, style: 'display:flex;align-items:center;min-height:32px;padding:0 8px;border-radius:6px;font-size:12px;font-weight:600;box-sizing:border-box;' + look[c] };
        }) };
      }),
      machines: machines
    };
  }
}

dcMount("<div style=\"box-sizing: border-box; min-height: 1680px; display: flex; flex-wrap: wrap; align-items: stretch; background: #F4F4F2; font-family: Inter, system-ui, sans-serif; color: #1C1C1A\">\n\n  <nav aria-label=\"Main\" style=\"flex: 1 1 220px; box-sizing: border-box; background: #FFFFFF; border-right: 1px solid #D4D4D0; padding: 24px 16px; display: flex; flex-direction: column; gap: 4px\">\n    <div style=\"display: flex; align-items: center; gap: 10px; padding: 0 8px 20px\">\n      <div style=\"width: 32px; height: 32px; border-radius: 6px; background: #E4E4E0; border: 1px dashed #8A8A85; display: flex; align-items: center; justify-content: center; font-size: 10px; color: #5E5E5A\">LOGO<\/div>\n      <div style=\"display: flex; flex-direction: column; gap: 2px\">\n        <div style=\"font-weight: 700; font-size: 15px\">Production Tower<\/div>\n        <div style=\"font-size: 11px; color: #5E5E5A\">Powered by itTrident<\/div>\n      <\/div>\n    <\/div>\n    <sc-for list=\"{{nav}}\" as=\"item\" hint-placeholder-count=\"6\">\n      <a href=\"{{item.href}}\" style=\"{{item.style}}\">{{item.label}}<\/a>\n    <\/sc-for>\n    <div style=\"margin-top: auto; padding: 12px 8px 0; border-top: 1px solid #E4E4E0; font-size: 12px; color: #5E5E5A; line-height: 1.5\">Plant: [PLANT CODE]<br>Shift: B (14:00–22:00)<\/div>\n  <\/nav>\n\n  <main style=\"flex: 999 1 560px; min-width: 0; box-sizing: border-box; padding: 28px 32px; display: flex; flex-direction: column; gap: 20px\">\n\n    <header style=\"display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px\">\n      <div>\n        <div style=\"font-size: 13px; color: #5E5E5A\">Today · [DATE]<\/div>\n        <h1 style=\"margin: 4px 0 0; font-size: 28px; font-weight: 700\">Plant overview<\/h1>\n      <\/div>\n      <div style=\"display: flex; flex-wrap: wrap; gap: 8px; align-items: center\">\n        <span style=\"font-size: 12px; color: #2F6B45; background: #E7F2EA; border-radius: 999px; padding: 6px 10px\">SAP synced 4 min ago · IoT live · Dept heads 6/7 checked in<\/span>\n        <label style=\"display: flex; flex-direction: column; font-size: 11px; color: #5E5E5A; gap: 2px\">Client\n          <select style=\"height: 36px; border: 1px solid #C4C4BF; border-radius: 6px; padding: 0 10px; font: inherit; font-size: 13px; color: #1C1C1A; background: #fff\"><option>All clients<\/option><\/select>\n        <\/label>\n        <label style=\"display: flex; flex-direction: column; font-size: 11px; color: #5E5E5A; gap: 2px\">Period\n          <select style=\"height: 36px; border: 1px solid #C4C4BF; border-radius: 6px; padding: 0 10px; font: inherit; font-size: 13px; color: #1C1C1A; background: #fff\"><option>Today<\/option><option>This week<\/option><option>This month<\/option><\/select>\n        <\/label>\n        <button style=\"height: 44px; padding: 0 16px; border-radius: 6px; border: 1px solid #C4C4BF; background: #fff; font: inherit; font-size: 13px; align-self: flex-end\">Export<\/button>\n      <\/div>\n    <\/header>\n\n    <section style=\"background: #EEF3FD; border: 1px solid #C9D7F5; border-radius: 8px; padding: 18px; display: flex; flex-direction: column; gap: 10px\">\n      <div style=\"display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px\">\n        <h2 style=\"margin: 0; font-size: 16px\">Today at a glance<\/h2>\n        <span style=\"font-size: 12px; color: #3A3A37\">AI summary · combines SAP, IoT and 6 department head updates · 18:07 · <a href=\"process-board.html\">Details →<\/a><\/span>\n      <\/div>\n      <ul style=\"margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; font-size: 14px; line-height: 1.5\">\n        <li>Output is at 88% of plan. Machining is the constraint: CNC-03 down (IoT), back by 19:00 (Machining head).<\/li>\n        <li>6 orders are behind. SO-[1042] recovers only if Shift C is approved. 3 approvals are waiting on you.<\/li>\n        <li>2 handoff gaps today: Machining → Welding on SO-[1042] (2 pcs) and Painting → Quality check on SO-[1044] (4 pcs).<\/li>\n        <li>Wastage is 3.2%: welding porosity traced to a new wire batch (Welding head). 8 scrapped units are not yet posted in SAP.<\/li>\n      <\/ul>\n    <\/section>\n\n    <section aria-label=\"Key metrics\"style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px\">\n      <sc-for list=\"{{kpis}}\" as=\"k\" hint-placeholder-count=\"6\">\n        <div style=\"background: #fff; border: 1px solid #D4D4D0; border-radius: 8px; padding: 16px; display: flex; flex-direction: column; gap: 6px\">\n          <div style=\"font-size: 12px; color: #5E5E5A\">{{k.label}}<\/div>\n          <div style=\"font-size: 26px; font-weight: 700\">{{k.value}}<\/div>\n          <div style=\"font-size: 12px; color: {{k.tone}}\">{{k.sub}}<\/div>\n          <div style=\"font-size: 11px; color: #6B6B66; border-top: 1px dashed #D4D4D0; padding-top: 6px\">Data: {{k.src}}<\/div>\n        <\/div>\n      <\/sc-for>\n    <\/section>\n\n    <div style=\"display: flex; flex-wrap: wrap; gap: 16px\">\n      <section style=\"flex: 2 1 520px; min-width: 0; background: #fff; border: 1px solid #D4D4D0; border-radius: 8px; padding: 18px; display: flex; flex-direction: column; gap: 12px\">\n        <div style=\"display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap\">\n          <h2 style=\"margin: 0; font-size: 16px\">Daily output — plan vs actual (14 days)<\/h2>\n          <div style=\"display: flex; gap: 14px; font-size: 12px; color: #5E5E5A\">\n            <span style=\"display: flex; align-items: center; gap: 6px\"><span style=\"width: 10px; height: 10px; background: #C4C4BF; display: inline-block\"><\/span>Plan<\/span>\n            <span style=\"display: flex; align-items: center; gap: 6px\"><span style=\"width: 10px; height: 10px; background: #2459D6; display: inline-block\"><\/span>Actual<\/span>\n          <\/div>\n        <\/div>\n        <div style=\"height: 220px; display: flex; align-items: flex-end; gap: 8px; border-bottom: 1px solid #C4C4BF; padding: 0 4px\">\n          <sc-for list=\"{{days}}\" as=\"d\" hint-placeholder-count=\"14\">\n            <div style=\"flex: 1 1 0; height: 100%; display: flex; align-items: flex-end; gap: 2px\">\n              <div style=\"flex: 1; background: #C4C4BF; height: {{d.plan}}\"><\/div>\n              <div style=\"flex: 1; background: #2459D6; height: {{d.actual}}\"><\/div>\n            <\/div>\n          <\/sc-for>\n        <\/div>\n        <div style=\"font-size: 11px; color: #6B6B66\">Data: plan from SAP PP · actuals from SAP confirmations, IoT counters (live) and department head shift-end confirmations<\/div>\n      <\/section>\n\n      <section style=\"flex: 1 1 300px; min-width: 0; background: #fff; border: 1px solid #D4D4D0; border-radius: 8px; padding: 18px; display: flex; flex-direction: column; gap: 10px\">\n        <div style=\"display: flex; justify-content: space-between; align-items: center\">\n          <h2 style=\"margin: 0; font-size: 16px\">Alerts &amp; approvals<\/h2>\n          <a href=\"#\" style=\"font-size: 13px\">View all<\/a>\n        <\/div>\n        <sc-for list=\"{{alerts}}\" as=\"a\" hint-placeholder-count=\"5\">\n          <div style=\"display: flex; gap: 10px; padding: 10px 0; border-top: 1px solid #ECECE8\">\n            <span style=\"font-size: 11px; font-weight: 600; color: {{a.tone}}; min-width: 64px\">{{a.level}}<\/span>\n            <div style=\"display: flex; flex-direction: column; gap: 2px\">\n              <div style=\"font-size: 13px\">{{a.text}}<\/div>\n              <div style=\"display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 11px; color: #6B6B66\"><span style=\"{{a.srcStyle}}\">{{a.src}}<\/span>{{a.meta}}<\/div>\n            <\/div>\n          <\/div>\n        <\/sc-for>\n      <\/section>\n    <\/div>\n\n    <div style=\"display: flex; flex-wrap: wrap; gap: 16px\">\n      <section style=\"flex: 2 1 520px; min-width: 0; background: #fff; border: 1px solid #D4D4D0; border-radius: 8px; padding: 18px; display: flex; flex-direction: column; gap: 12px\">\n        <div style=\"display: flex; justify-content: space-between; align-items: center\">\n          <h2 style=\"margin: 0; font-size: 16px\">Orders behind schedule<\/h2>\n          <a href=\"orders.html\" style=\"font-size: 13px\">All orders →<\/a>\n        <\/div>\n        <div style=\"overflow-x: auto\">\n          <table style=\"width: 100%; border-collapse: collapse; font-size: 13px; min-width: 860px\">\n            <thead>\n              <tr style=\"text-align: left; color: #5E5E5A; font-size: 12px\">\n                <th style=\"padding: 8px; border-bottom: 1px solid #D4D4D0; font-weight: 500\">Order<\/th>\n                <th style=\"padding: 8px; border-bottom: 1px solid #D4D4D0; font-weight: 500\">Client<\/th>\n                <th style=\"padding: 8px; border-bottom: 1px solid #D4D4D0; font-weight: 500\">Due<\/th>\n                <th style=\"padding: 8px; border-bottom: 1px solid #D4D4D0; font-weight: 500\">Complete<\/th>\n                <th style=\"padding: 8px; border-bottom: 1px solid #D4D4D0; font-weight: 500\">Behind by<\/th>\n                <th style=\"padding: 8px; border-bottom: 1px solid #D4D4D0; font-weight: 500\">Forecast ETA<\/th>\n                <th style=\"padding: 8px; border-bottom: 1px solid #D4D4D0; font-weight: 500\">Latest from floor<\/th>\n                <th style=\"padding: 8px; border-bottom: 1px solid #D4D4D0; font-weight: 500\">Status<\/th>\n              <\/tr>\n            <\/thead>\n            <tbody>\n              <sc-for list=\"{{orders}}\" as=\"o\" hint-placeholder-count=\"5\">\n                <tr>\n                  <td style=\"padding: 10px 8px; border-bottom: 1px solid #ECECE8\"><a href=\"order-detail.html\">{{o.id}}<\/a><\/td>\n                  <td style=\"padding: 10px 8px; border-bottom: 1px solid #ECECE8\">{{o.client}}<\/td>\n                  <td style=\"padding: 10px 8px; border-bottom: 1px solid #ECECE8\">{{o.due}}<\/td>\n                  <td style=\"padding: 10px 8px; border-bottom: 1px solid #ECECE8\">\n                    <div style=\"display: flex; align-items: center; gap: 8px\">\n                      <div style=\"width: 80px; height: 6px; background: #ECECE8; border-radius: 3px\"><div style=\"height: 6px; border-radius: 3px; background: #2459D6; width: {{o.pct}}\"><\/div><\/div>\n                      <span>{{o.pct}}<\/span>\n                    <\/div>\n                  <\/td>\n                  <td style=\"padding: 10px 8px; border-bottom: 1px solid #ECECE8\">{{o.behind}}<\/td>\n                  <td style=\"padding: 10px 8px; border-bottom: 1px solid #ECECE8\">{{o.eta}}<\/td>\n                  <td style=\"padding: 10px 8px; border-bottom: 1px solid #ECECE8; font-size: 12px; color: #3A3A37; min-width: 180px\">{{o.note}}<\/td>\n                  <td style=\"padding: 10px 8px; border-bottom: 1px solid #ECECE8\"><span style=\"{{o.badge}}\">{{o.status}}<\/span><\/td>\n                <\/tr>\n              <\/sc-for>\n            <\/tbody>\n          <\/table>\n        <\/div>\n      <\/section>\n\n      <section style=\"flex: 1 1 300px; min-width: 0; background: #fff; border: 1px solid #D4D4D0; border-radius: 8px; padding: 18px; display: flex; flex-direction: column; gap: 12px\">\n        <div style=\"display: flex; justify-content: space-between; align-items: center\">\n          <h2 style=\"margin: 0; font-size: 16px\">Load by department<\/h2>\n          <a href=\"shop-floor.html\" style=\"font-size: 13px\">Shop floor →<\/a>\n        <\/div>\n        <sc-for list=\"{{depts}}\" as=\"d\" hint-placeholder-count=\"7\">\n          <div style=\"display: flex; flex-direction: column; gap: 4px\">\n            <div style=\"display: flex; justify-content: space-between; font-size: 13px\"><span>{{d.name}}<\/span><span style=\"display: flex; align-items: center; gap: 8px\"><span style=\"color: #5E5E5A\">{{d.wip}} WIP · {{d.load}}<\/span><span style=\"{{d.hbadge}}\">{{d.hstatus}}<\/span><\/span><\/div>\n            <div style=\"height: 8px; background: #ECECE8; border-radius: 4px\"><div style=\"height: 8px; border-radius: 4px; background: {{d.color}}; width: {{d.bar}}\"><\/div><\/div>\n          <\/div>\n        <\/sc-for>\n        <div style=\"font-size: 11px; color: #6B6B66\">Load = required hours ÷ available hours this week (SAP PP capacity + HR roster). Status chip = department head's shift update<\/div>\n      <\/section>\n    <\/div>\n\n    <section style=\"background: #fff; border: 1px solid #D4D4D0; border-radius: 8px; padding: 18px; display: flex; flex-direction: column; gap: 12px\">\n      <div style=\"display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px\">\n        <h2 style=\"margin: 0; font-size: 16px\">Where orders stand in each department<\/h2>\n        <span style=\"font-size: 13px; color: #5E5E5A\">5 orders with challenges · 2 handoff gaps · <a href=\"process-board.html\">Process board →<\/a><\/span>\n      <\/div>\n      <div style=\"overflow-x: auto\">\n        <div style=\"min-width: 860px; display: flex; flex-direction: column; gap: 6px\">\n          <div style=\"display: grid; grid-template-columns: 120px repeat(7, minmax(0, 1fr)); gap: 6px; font-size: 12px; color: #5E5E5A\">\n            <span>Order<\/span>\n            <sc-for list=\"{{pdepts}}\" as=\"h\" hint-placeholder-count=\"7\"><span>{{h}}<\/span><\/sc-for>\n          <\/div>\n          <sc-for list=\"{{prows}}\" as=\"r\" hint-placeholder-count=\"5\">\n            <a href=\"process-board.html\" style=\"display: grid; grid-template-columns: 120px repeat(7, minmax(0, 1fr)); gap: 6px; text-decoration: none; color: #1C1C1A; align-items: stretch\">\n              <span style=\"font-size: 13px; font-weight: 600; color: #2459D6; display: flex; align-items: center\">{{r.id}}<\/span>\n              <sc-for list=\"{{r.cells}}\" as=\"c\" hint-placeholder-count=\"7\">\n                <span style=\"{{c.style}}\">{{c.label}}<\/span>\n              <\/sc-for>\n            <\/a>\n          <\/sc-for>\n        <\/div>\n      <\/div>\n      <div style=\"font-size: 11px; color: #6B6B66\">Green done · blue in progress · amber at risk · red on hold · dashed not started · blank not in route. Status from SAP/IoT and handoffs; challenges from department heads' shift updates.<\/div>\n    <\/section>\n\n    <section style=\"background: #fff; border: 1px solid #D4D4D0; border-radius: 8px; padding: 18px; display: flex; flex-direction: column; gap: 12px\">\n      <div style=\"display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px\">\n        <h2 style=\"margin: 0; font-size: 16px\">Machines — live status<\/h2>\n        <span style=\"font-size: 12px; color: #5E5E5A\">Running 18 · Idle 4 · Down 2 · Source: IoT gateway (OPC UA / MQTT)<\/span>\n      <\/div>\n      <div style=\"display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px\">\n        <sc-for list=\"{{machines}}\" as=\"m\" hint-placeholder-count=\"8\">\n          <div style=\"border: 1px solid #D4D4D0; border-radius: 6px; padding: 10px; display: flex; flex-direction: column; gap: 4px; border-top: 4px solid {{m.color}}\">\n            <div style=\"font-size: 13px; font-weight: 600\">{{m.name}}<\/div>\n            <div style=\"font-size: 12px; color: #3A3A37\">{{m.state}}<\/div>\n            <div style=\"font-size: 11px; color: #6B6B66\">Utilisation {{m.util}}<\/div>\n          <\/div>\n        <\/sc-for>\n      <\/div>\n    <\/section>\n\n    <footer style=\"margin-top: auto; padding-top: 16px; border-top: 1px solid #D4D4D0; font-size: 12px; color: #5E5E5A\">Powered by <strong style=\"color: #1C1C1A\">itTrident<\/strong><\/footer>\n  <\/main>\n<\/div>", Component, document.getElementById('root'));
