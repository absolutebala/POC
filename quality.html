dcMount("<div style=\"box-sizing: border-box; min-height: 1120px; display: flex; flex-wrap: wrap; align-items: stretch; background: #F4F4F2; font-family: Inter, system-ui, sans-serif; color: #1C1C1A\">\n\n  <nav aria-label=\"Main\" style=\"flex: 1 1 220px; box-sizing: border-box; background: #FFFFFF; border-right: 1px solid #D4D4D0; padding: 24px 16px; display: flex; flex-direction: column; gap: 4px\">\n    <div style=\"display: flex; align-items: center; gap: 10px; padding: 0 8px 20px\">\n      <div style=\"width: 32px; height: 32px; border-radius: 6px; background: #E4E4E0; border: 1px dashed #8A8A85; display: flex; align-items: center; justify-content: center; font-size: 10px; color: #5E5E5A\">LOGO<\/div>\n      <div style=\"display: flex; flex-direction: column; gap: 2px\">\n        <div style=\"font-weight: 700; font-size: 15px\">Production Tower<\/div>\n        <div style=\"font-size: 11px; color: #5E5E5A\">Powered by itTrident<\/div>\n      <\/div>\n    <\/div>\n    <sc-for list=\"{{nav}}\" as=\"item\" hint-placeholder-count=\"6\">\n      <a href=\"{{item.href}}\" style=\"{{item.style}}\">{{item.label}}<\/a>\n    <\/sc-for>\n  <\/nav>\n\n  <main style=\"flex: 999 1 560px; min-width: 0; box-sizing: border-box; padding: 28px 32px; display: flex; flex-direction: column; gap: 20px\">\n\n    <header style=\"display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px\">\n      <div>\n        <div style=\"font-size: 13px; color: #5E5E5A\">This week · all clients<\/div>\n        <h1 style=\"margin: 4px 0 0; font-size: 28px; font-weight: 700\">Quality &amp; wastage<\/h1>\n      <\/div>\n      <div style=\"display: flex; gap: 8px; flex-wrap: wrap; align-items: flex-end\">\n        <label style=\"display: flex; flex-direction: column; font-size: 11px; color: #5E5E5A; gap: 2px\">Department\n          <select style=\"height: 36px; border: 1px solid #C4C4BF; border-radius: 6px; padding: 0 10px; font: inherit; font-size: 13px; background: #fff\"><option>All<\/option><\/select>\n        <\/label>\n        <label style=\"display: flex; flex-direction: column; font-size: 11px; color: #5E5E5A; gap: 2px\">Period\n          <select style=\"height: 36px; border: 1px solid #C4C4BF; border-radius: 6px; padding: 0 10px; font: inherit; font-size: 13px; background: #fff\"><option>This week<\/option><option>This month<\/option><\/select>\n        <\/label>\n      <\/div>\n    <\/header>\n\n    <section aria-label=\"Quality metrics\" style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px\">\n      <sc-for list=\"{{kpis}}\" as=\"k\" hint-placeholder-count=\"5\">\n        <div style=\"background: #fff; border: 1px solid #D4D4D0; border-radius: 8px; padding: 16px; display: flex; flex-direction: column; gap: 6px\">\n          <div style=\"font-size: 12px; color: #5E5E5A\">{{k.label}}<\/div>\n          <div style=\"font-size: 26px; font-weight: 700\">{{k.value}}<\/div>\n          <div style=\"font-size: 12px; color: {{k.tone}}\">{{k.sub}}<\/div>\n        <\/div>\n      <\/sc-for>\n    <\/section>\n\n    <div style=\"display: flex; flex-wrap: wrap; gap: 16px\">\n      <section style=\"flex: 1 1 420px; min-width: 0; background: #fff; border: 1px solid #D4D4D0; border-radius: 8px; padding: 18px; display: flex; flex-direction: column; gap: 12px\">\n        <h2 style=\"margin: 0; font-size: 16px\">Top defect causes (Pareto)<\/h2>\n        <sc-for list=\"{{pareto}}\" as=\"p\" hint-placeholder-count=\"6\">\n          <div style=\"display: grid; grid-template-columns: 180px minmax(0, 1fr) 90px; gap: 10px; align-items: center; font-size: 13px\">\n            <span>{{p.name}}<\/span>\n            <div style=\"height: 14px; background: #ECECE8; border-radius: 3px\"><div style=\"height: 14px; border-radius: 3px; background: #D97706; width: {{p.bar}}\"><\/div><\/div>\n            <span style=\"color: #5E5E5A; text-align: right\">{{p.qty}} · {{p.cum}}<\/span>\n          <\/div>\n        <\/sc- y>\n          <\/table>\n        <\/div>\n        <div style=\"font-size: 11px; color: #6B6B66\">Source: SAP PP scrap quantities × SAP MM material cost<\/div>\n      <\/section>\n    <\/div>\n\n    <section style=\"background: #fff; border: 1px solid #D4D4D0; border-radius: 8px; padding: 18px; display: flex; flex-direction: column; gap: 12px\">\n      <div style=\"display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px\">\n        <h2 style=\"margin: 0; font-size: 16px\">Scrap % trend — 8 weeks<\/h2>\n        <span style=\"font-size: 12px; color: #5E5E5A\">Dashed line = target 2.5%<\/span>\n      <\/div>\n      <div style=\"position: relative; height: 160px; display: flex; align-items: flex-end; gap: 16px; border-bottom: 1px solid #C4C4BF; padding: 0 4px\">\n        <div aria-hidden=\"true\" style=\"position: absolute; left: 0; right: 0; bottom: 80px; border-top: 2px dashed #1C1C1A\"><\/div>\n        <sc-for list=\"{{trend}}\" as=\"t\" hint-placeholder-count=\"8\">\n          <div style=\"flex: 1 1 0; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; gap: 4px\">\n            <span style=\"font-size: 11px; color: #5E5E5A\">{{t.v}}<\/span>\n            <div style=\"width: 100%; background: #2459D6; height: {{t.h}}\"><\/div>\n          <\/div>\n        <\/sc-for>\n      <\/div>\n      <div style=\"display: flex; justify-content: space-between; font-size: 11px; color: #6B6B66\"><span>W[39]<\/span><span>W[46]<\/span><\/div>\n    <\/section>\n\n    <section style=\"background: #fff; border: 1px solid #D4D4D0; border-radius: 8px; padding: 18px; display: flex; flex-direction: column; gap: 12px\">\n      <div style=\"display: flex; justify-content: space-between; align-items: center\">\n        <h2 style=\"margin: 0; font-size: 16px\">Open quality issues<\/h2>\n        <button style=\"height: 44px; padding: 0 16px; border-radius: 6px; border: 1px solid #C4C4BF; background: #fff; font: inherit; font-size: 13px\">Raise issue<\/button>\n      <\/div>\n      <div style=\"overflow-x: auto\">\n        <table style=\"width: 100%; border-collapse: collapse; font-size: 13px; min-width: 760px\">\n          <thead>\n            <tr style=\"text-align: left; color: #5E5E5A; font-size: 12px\">\n              <th style=\"padding: 8px; border-bottom: 1px solid #D4D4D0; font-weight: 500\">Notification<\/th>\n              <th style=\"padding: 8px; border-bottom: 1px solid #D4D4D0; font-weight: 500\">Order<\/th>\n              <th style=\"padding: 8px; border-bottom: 1px solid #D4D4D0; font-weight: 500\">Defect<\/th>\n              <th style=\"padding: 8px; border-bottom: 1px solid #D4D4D0; font-weight: 500\">Qty<\/th>\n              <th style=\"padding: 8px; border-bottom: 1px solid #D4D4D0; font-weight: 500\">Decision<\/th>\n              <th style=\"padding: 8px; border-bottom: 1px solid #D4D4D0; font-weight: 500\">Owner<\/th>\n              <th style=\"padding: 8px; border-bottom: 1px solid #D4D4D0; font-weight: 500\">Age<\/th>\n            <\/tr>\n          <\/thead>\n          <tbody>\n            <sc-for list=\"{{issues}}\" as=\"i\" hint-placeholder-count=\"4\">\n              <tr>\n                <td style=\"padding: 10px 8px; border-bottom: 1px solid #ECECE8\">{{i.no}}<\/td>\n                <td style=\"padding: 10px 8px; border-bottom: 1px solid #ECECE8\"><a href=\"order-detail.html\">{{i.order}}<\/a><\/td>\n                <td style=\"padding: 10px 8px; border-bottom: 1px solid #ECECE8\">{{i.defect}}<\/td>\n                <td style=\"padding: 10px 8px; border-bottom: 1px solid #ECECE8\">{{i.qty}}<\/td>\n                <td style=\"padding: 10px 8px; border-bottom: 1px solid #ECECE8\">{{i.dec}}<\/td>\n                <td style=\"padding: 10px 8px; border-bottom: 1px solid #ECECE8\">{{i.owner}}<\/td>\n                <td style=\"padding: 10px 8px; border-bottom: 1px solid #ECECE8\">{{i.age}}<\/td>\n              <\/tr>\n            <\/sc-for>\n          <\/tbody>\n        <\/table>\n      <\/div>\n    <\/section>\n    <footer style=\"margin-top: auto; padding-top: 16px; border-top: 1px solid #D4D4D0; font-size: 12px; color: #5E5E5A\">Powered by <strong style=\"color: #1C1C1A\">itTrident<\/strong><\/footer>\n  <\/main>\n<\/div>", Component, document.getElementById('root'));
