: 500\">Cost<\/th>\n                <th style=\"padding: 8px; border-bottom: 1px solid #DCE4E3; font-weight: 500\">vs target<\/th>\n              <\/tr>\n            <\/thead>\n            <tbody>\n              <sc-for list=\"{{waste}}\" as=\"w\" hint-placeholder-count=\"6\">\n                <tr>\n                  <td style=\"padding: 10px 8px; border-bottom: 1px solid #EBF0EF\">{{w.dept}}<\/td>\n                  <td style=\"padding: 10px 8px; border-bottom: 1px solid #EBF0EF\">{{w.pct}}<\/td>\n                  <td style=\"padding: 10px 8px; border-bottom: 1px solid #EBF0EF\">{{w.mat}}<\/td>\n                  <td style=\"padding: 10px 8px; border-bottom: 1px solid #EBF0EF\">{{w.cost}}<\/td>\n                  <td style=\"padding: 10px 8px; border-bottom: 1px solid #EBF0EF; color: {{w.tone}}; font-weight: 600\">{{w.vs}}<\/td>\n                <\/tr>\n              <\/sc-for>\n            <\/tbody>\n          <\/table>\n        <\/div>\n        <div style=\"font-size: 11px; color: #637170\">Source: SAP PP scrap quantities × SAP MM material cost<\/div>\n      <\/section>\n    <\/div>\n\n    <section style=\"background: #fff; border: 1px solid #DCE4E3; border-radius: 12px; padding: 18px; display: flex; flex-direction: column; gap: 12px\">\n      <div style=\"display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px\">\n        <h2 style=\"margin: 0; font-size: 16px\">Scrap % trend — 8 weeks<\/h2>\n        <span style=\"font-size: 12px; color: #55605F\">Dashed line = target 2.5%<\/span>\n      <\/div>\n      <div style=\"position: relative; height: 160px; display: flex; align-items: flex-end; gap: 16px; border-bottom: 1px solid #C3CFCD; padding: 0 4px\">\n        <div aria-hidden=\"true\" style=\"position: absolute; left: 0; right: 0; bottom: 80px; border-top: 2px dashed #102A28\"><\/div>\n        <sc-for list=\"{{trend}}\" as=\"t\" hint-placeholder-count=\"8\">\n          <div style=\"flex: 1 1 0; display: flex; flex-direction:
