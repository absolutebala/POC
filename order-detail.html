  renderVals() {

      ['Quality & wastage','quality.html'],['Capacity & resources','capacity.html'],['Data sources','data-sources.html']
    ];
    var ICONS = {
      'Plant overview': 'M3 3h7v9H3zM14 3h7v5h-7zM14 12h7v9h-7zM3 16h7v5H3z',
      'Orders': 'M9 3h6v3H9zM7 4.5H5V21h14V4.5h-2M9 11h6M9 15h6M9 19h3',
      'Process board': 'M3 4h18v16H3zM3 9.5h18M3 15h18M9 4v16M15 4v16',
      'Shop floor': 'M3 21V10l5 3v-3l5 3v-3l5 3V4h3v17zM7 17h2M12 17h2M17 17h1',
      'Quality & wastage': 'M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6zM9 12l2 2 4-4',
      'Capacity & resources': 'M16 20v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M9 11a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7M22 20v-2a4 4 0 0 0-3-3.9M16 4.1a3.5 3.5 0 0 1 0 6.8',

    };
    var nav = navItems.map(function (n) {

      return { label: n[0], href: n[1], icon: ICONS[n[0]], style: 'display:flex;align-items:center;gap:12px;min-height:44px;padding:0 12px;border-radius:8px;text-decoration:none;font-size:14px;' + (on ? 'background:#0F766E;color:#FFFFFF;font-weight:600' : 'color:#CFE7E3') };
    });

    var stages = [
      [1,'Cutting','Done','','100%','2,400','0','1.2%','2.4 t MS plate issued','2,400 to Machining','No challenge reported'],
      [2,'Machining','On hold','Blocked','58%','1,392','260','2.9%','2,400 from Cutting','1,180 to Welding · last 120 sent, 118 accepted','CNC-03 overheat, back by 19:00. Shift C requested (18:05)'],

      [4,'Fabrication','In progress','','47%','1,130','80','0.6%','1,130 accepted','1,104 to Painting','Idle risk tomorrow if Welding lags (17:40)'],
      [5,'Painting','In progress','','46%','1,104','40','0.4%','1,104 accepted','1,104 to Quality check','Shift update pending (due 18:30)'],

    var scrap = [3,4,6,2,0,3,5,4,3,4];

    return {

      days: days,

        { what: 'Overtime on Welding (1 welder)', need: '+16 h' },
        { what: 'Restore CNC-03 (maintenance)', need: 'Today' },
        { what: 'MS plate 6 mm to procure', need: '1.5 t' }
      ],

      feed: [
        { time: '18:20', text: 'Handoff Machining → Welding: 120 sent, 118 accepted · 2 pcs gap flagged', src: 'Handoff' },
        { time: '18:05', text: 'Machining shift update: CNC-03 back by 19:00 · requests Shift C (4 operators) to recover this order', src: 'Dept head' },
        { time: '17:58', text: 'Welding shift update: porosity traced to new wire batch, switched back at 17:30', src: 'Dept head' },
        { time: '17:42', text: 'CNC-03 stopped — spindle temperature 92 °C', src: 'IoT' },
        { time: '16:10', text: 'Machining confirmed 84 units, 3 scrap', src: 'SAP PP' },
        { time: '15:05', text: 'QM notification: weld porosity, 6 units', src: 'SAP QM' },
        { time: '14:00', text: 'Shift B started · 2 welders absent', src: 'HR' },
        { time: '11:20', text: 'Goods issue: MS plate 0.8 t to Cutting', src: 'SAP MM' }
      ]
    };
  }
}

idth=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\"><path d=\"M11 18a7 7 0 1 0 0-14 7 7 0 0 0 0 14zM21 21l-5-5\"><\/path><\/svg>\n        <input type=\"search\" aria-label=\"Search orders, machines and materials\" placeholder=\"Search orders, machines, materials…\" style=\"flex: 1; min-width: 0; height: 36px; border: 0; background: transparent; font: inherit; font-size: 13px; color: #102A28\">\n      <\/div>\n      <div style=\"display: flex; flex-wrap: wrap; align-items: center; gap: 12px\">\n        <span style=\"font-size: 12px; font-weight: 500; color: #115E59; background: #E6F4F1; border-radius: 999px; padding: 6px 12px\">[Plant name] · Shift B · 14:00–22:00<\/span>\n        <button aria-label=\"Notifications, 5 new\" style=\"position: relative; width: 44px; height: 44px; border-radius: 8px; border: 1px solid #DCE4E3; background: #FFFFFF; color: #33403F; display: flex; align-items: center; justify-content: center; cursor: pointer\">\n          <svg aria-hidden=\"true\" width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9M10.3 21a1.9 1.9 0 0 0 3.4 0\"><\/path><\/svg>\n          <span style=\"position: absolute; top: 5px; right: 5px; min-width: 16px; height: 16px; border-radius: 999px; background: #B42318; color: #FFFFFF; font-size: 10px; font-weight: 700; display: flex; align-items: center; justify-content: center\">5<\/span>\n        <\/button>\n        <div style=\"display: flex; align-items: center; gap: 8px\">\n          <span aria-hidden=\"true\" style=\"width: 36px; height: 36px; border-radius: 50%; background: #0F766E; color: #FFFFFF; font-size: 13px; font-weight: 600; display: flex; align-items: center; justify-content: center\">PH<\/span>\n          <span style=\"display: flex; flex-direction: column; font-size: 12px; line-height: 1.3\"><strong style=\"font-size: 13px; color: #102A28\">[User name]<\/strong><span style=\"color: #637170\">Plant head<\/span><\/span>\n        <\/div>\n      <\/div>\n    <\/div>\n\n\n    <div style=\"font-size: 13px; color: #55605F\"><a href=\"orders.html\">Orders<\/a> / SO-[1042]<\/div>\n    <header style=\"display: flex; flex-wrap: wrap; align-items: flex-start; justify-content: space-between; gap: 16px\">\n      <div style=\"display: flex; flex-direction: column; gap: 6px\">\n        <div style=\"display: flex; align-items: center; gap: 12px; flex-wrap: wrap\">\n          <h1 style=\"margin: 0; font-size: 26px; font-weight: 700; letter-spacing: -0.01em\">SO-[1042] · [Bracket assy BX-20]<\/h1>\n          <span style=\"font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 999px; background: #FBE9E7; color: #A12A1C\">Behind · 7 days late<\/span>\n        <\/div>\n        <div style=\"font-size: 13px; color: #55605F\">[Client A] · PO [REF] · Prod. orders [1000231–1000234] · Due [22 Nov] · Forecast [29 Nov]<\/div>\n      <\/div>\n      <div style=\"display: flex; gap: 8px; flex-wrap: wrap\">\n        <button style=\"height: 44px; padding: 0 16px; border-radius: 6px; border: 1px solid #C3CFCD; background: #fff; font: inherit; font-size: 13px\">Open in SAP<\/button>\n        <button style=\"height: 44px; padding: 0 16px; border-radius: 6px; border: 1px solid #C3CFCD; background: #fff; font: inherit; font-size: 13px\">Notify client<\/button>\n        <a href=\"capacity.html\" style=\"display: inline-flex; align-items: center; height: 44px; padding: 0 16px; border-radius: 6px; background: #0F766E; color: #fff; font-size: 13px; font-weight: 600; text-decoration: none\">Plan recovery<\/a>\n      <\/div>\n    <\/header>\n\n    <section aria-label=\"Order metrics\" style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px\">\n      <sc-for list=\"{{kpis}}\" as=\"k\" hint-placeholder-count=\"7\">\n        <div style=\"background: #fff; border: 1px solid #DCE4E3; border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 4px\">\n          <div style=\"font-size: 12px; color: #55605F\">{{k.label}}<\/div>\n          <div style=\"font-size: 22px; font-weight: 700\">{{k.value}}<\/div>\n          <div style=\"font-size: 12px; color: #55605F\">{{k.sub}}<\/div>\n        <\/div>\n      <\/sc-for>\n    <\/section>\n\n    <section style=\"background: #fff; border: 1px solid #DCE4E3; border-radius: 12px; padding: 18px; display: flex; flex-direction: column; gap: 14px\">\n      <div style=\"display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px\">\n        <h2 style=\"margin: 0; font-size: 16px\">Journey through departments<\/h2>\n        <a href=\"process-board.html\" style=\"font-size: 13px\">Process board →<\/a>\n      <\/div>\n      <div style=\"display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px\">\n        <sc-for list=\"{{stages}}\" as=\"s\" hint-placeholder-count=\"7\">\n          <div style=\"flex: 1 0 170px; border: 1px solid #DCE4E3; border-radius: 6px; padding: 12px; display: flex; flex-direction: column; gap: 6px; border-top: 4px solid {{s.color}}\">\n            <div style=\"font-size: 11px; color: #637170\">Step {{s.n}}<\/div>\n            <div style=\"font-size: 14px; font-weight: 600\">{{s.name}}<\/div>\n            <div style=\"display: flex; flex-wrap: wrap; gap: 4px; align-items: center\">\n              <span style=\"font-size: 12px; font-weight: 600; color: {{s.color}}\">{{s.state}}<\/span>\n              <sc-if value=\"{{s.hasFlag}}\" hint-placeholder-val=\"{{ false }}\"><span style=\"font-size: 11px; font-weight: 600; padding: 2px 6px; border-radius: 999px; background: #FDF0E1; color: #97470A\">{{s.flag}}<\/span><\/sc-if>\n            <\/div>\n            <div style=\"height: 6px; background: #EBF0EF; border-radius: 3px\"><div style=\"height: 6px; border-radius: 3px; background: {{s.color}}; width: {{s.pct}}\"><\/div><\/div>\n            <div style=\"font-size: 12px; color: #55605F\">{{s.done}} done · {{s.wip}} waiting · scrap {{s.scrap}}<\/div>\n            <div style=\"font-size: 12px; color: #33403F; border-top: 1px dashed #DCE4E3; padding-top: 6px\">In: {{s.inQ}}<\/div>\n            <div style=\"font-size: 12px; color: #33403F\">Out: {{s.outQ}}<\/div>\n            <div style=\"font-size: 12px; color: #33403F; background: {{s.noteBg}}; border-radius: 4px; padding: 6px; line-height: 1.4\">{{s.note}}<\/div>\n          <\/div>\n        <\/sc-for>\n      <\/div>\n      <div style=\"font-size: 11px; color: #637170\">Progress: SAP PP confirmations + IoT counters · In/Out: department handoffs (sent / accepted) · Notes: department head shift updates<\/div>\n    <\/section>\n\n    <div style=\"display: flex; flex-wrap: wrap; gap: 16px\">\n      <section style=\"flex: 2 1 520px; min-width: 0; background: #fff; border: 1px solid #DCE4E3; border-radius: 12px; padding: 18px; display: flex; flex-direction: column; gap: 12px\">\n        <div style=\"display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px\">\n          <h2 style=\"margin: 0; font-size: 16px\">Daily productivity vs required rate<\/h2>\n          <div style=\"display: flex; gap: 14px; font-size: 12px; color: #55605F\">\n            <span style=\"display: flex; align-items: center; gap: 6px\"><span style=\"width: 10px; height: 10px; background: #0F766E; display: inline-block\"><\/span>Good units<\/span>\n            <span style=\"display: flex; align-items: center; gap: 6px\"><span style=\"width: 10px; height: 10px; background: #D97706; display: inline-block\"><\/span>Scrap<\/span>\n            <span style=\"display: flex; align-items: center; gap: 6px\"><span style=\"width: 14px; height: 0; border-top: 2px dashed #102A28; display: inline-block\"><\/span>Required 160/day<\/span>\n          <\/div>\n        <\/div>\n        <div style=\"position: relative; height: 220px; display: flex; align-items: flex-end; gap: 10px; border-bottom: 1px solid #C3CFCD; padding: 0 4px\">\n          <div aria-hidden=\"true\" style=\"position: absolute; left: 0; right: 0; bottom: 160px; border-top: 2px dashed #102A28\"><\/div>\n          <sc-for list=\"{{days}}\" as=\"d\" hint-placeholder-count=\"10\">\n            <div style=\"flex: 1 1 0; display: flex; flex-direction: column; justify-content: flex-end; height: 100%\">\n              <div style=\"background: #D97706; height: {{d.scrap}}\"><\/div>\n              <div style=\"background: #0F766E; height: {{d.good}}\"><\/div>\n            <\/div>\n          <\/sc-for>\n        <\/div>\n        <div style=\"display: flex; justify-content: space-between; font-size: 11px; color: #637170\"><span>[10 Nov]<\/span><span>Avg last 7 days: 112 good/day · needed 160/day to hit due date<\/span><span>[19 Nov]<\/span><\/div>\n      <\/section>\n\n      <section style=\"flex: 1 1 300px; min-width: 0; background: #fff; border: 1px solid #DCE4E3; border-radius: 12px; padding: 18px; display: flex; flex-direction: column; gap: 12px\">\n        <h2 style=\"margin: 0; font-size: 16px\">What it takes to recover<\/h2>\n        <div style=\"font-size: 13px; color: #33403F; line-height: 1.5\">Remaining 1,296 units. At current rate ETA is [29 Nov]. To ship by [24 Nov] (revised):<\/div>\n        <sc-for list=\"{{levers}}\" as=\"l\" hint-placeholder-count=\"4\">\n          <div style=\"display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; border-top: 1px solid #EBF0EF; font-size: 13px\">\n            <span>{{l.what}}<\/span><span style=\"font-weight: 600; white-space: nowrap\">{{l.need}}<\/span>\n          <\/div>\n        <\/sc-for>\n        <div style=\"font-size: 11px; color: #637170\">Bottleneck: Machining (CNC-03 down 42 min, 108% loaded)<\/div>\n      <\/section>\n    <\/div>\n\n    <div style=\"display: flex; flex-wrap: wrap; gap: 16px\">\n      <section style=\"flex: 1 1 380px; min-width: 0; background: #fff; border: 1px solid #DCE4E3; border-radius: 12px; padding: 18px; display: flex; flex-direction: column; gap: 10px\">\n        <h2 style=\"margin: 0; font-size: 16px\">Wastage &amp; defects on this order<\/h2>\n        <sc-for list=\"{{defects}}\" as=\"d\" hint-placeholder-count=\"4\">\n          <div style=\"display: flex; flex-direction: column; gap: 4px\">\n            <div style=\"display: flex; justify-content: space-between; font-size: 13px\"><span>{{d.name}}<\/span><span style=\"color: #55605F\">{{d.qty}}<\/span><\/div>\n            <div style=\"height: 8px; background: #EBF0EF; border-radius: 4px\"><div style=\"height: 8px; border-radius: 4px; background: #D97706; width: {{d.bar}}\"><\/div><\/div>\n          <\/div>\n        <\/sc-for>\n        <div style=\"font-size: 11px; color: #637170\">Scrap cost so far: ₹[AMOUNT] · Source: SAP QM notifications + PP scrap<\/div>\n      <\/section>\n\n      <section style=\"flex: 1 1 380px; min-width: 0; background: #fff; border: 1px solid #DCE4E3; border-radius: 12px; padding: 18px; display: flex; flex-direction: column; gap: 4px\">\n        <h2 style=\"margin: 0 0 6px; font-size: 16px\">Activity<\/h2>\n        <sc-for list=\"{{feed}}\" as=\"f\" hint-placeholder-count=\"5\">\n          <div style=\"display: flex; gap: 12px; padding: 8px 0; border-top: 1px solid #EBF0EF; font-size: 13px\">\n            <span style=\"color: #637170; min-width: 64px; font-size: 12px\">{{f.time}}<\/span>\n            <span style=\"flex: 1\">{{f.text}}<\/span>\n            <span style=\"font-size: 11px; color: #55605F; background: #EEF2F1; border-radius: 4px; padding: 2px 6px; align-self: flex-start\">{{f.src}}<\/span>\n          <\/div>\n        <\/sc-for>\n      <\/section>\n    <\/div>\n    <footer style=\"margin-top: auto; padding-top: 16px; border-top: 1px solid #DCE4E3; font-size: 12px; color: #55605F\">Powered by <strong style=\"color: #102A28\">itTrident<\/strong><\/footer>\n  <\/main>\n<\/div>", Component, document.getElementById('root'));
