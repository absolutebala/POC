class Component extends DCLogic {
  renderVals() {
    var self = this;
    var navItems = [
      ['Plant overview','index.html'],['Orders','orders.html'],['Process board','process-board.html'],['Shop floor','shop-floor.html'],
      ['Quality & wastage','quality.html'],['Capacity & resources','capacity.html'],['Data sources','data-sources.html']
    ];
    var ICONS = {
      'Plant overview': 'M3 3h7v9H3zM14 3h7v5h-7zM14 12h7v9h-7zM3 16h7v5H3z',
      'Orders': 'M9 3h6v3H9zM7 4.5H5V21h14V4.5h-2M9 11h6M9 15h6M9 19h3',
      'Process board': 'M3 4h18v16H3zM3 9.5h18M3 15h18M9 4v16M15 4v16',
      'Shop floor': 'M3 21V10l5 3v-3l5 3v-3l5 3V4h3v17zM7 17h2M12 17h2M17 17h1',
      'Quality & wastage': 'M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6zM9 12l2 2 4-4',
      'Capacity & resources': 'M16 20v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M9 11a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7M22 20v-2a4 4 0 0 0-3-3.9M16 4.1a3.5 3.5 0 0 1 0 6.8',
      'Data sources': 'M12 3c4.4 0 8 1.3 8 3s-3.6 3-8 3-8-1.3-8-3 3.6-3 8-3zM4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3'
    };
    var nav = navItems.map(function (n) {
      var on = n[0] === 'Capacity & resources';
      return { label: n[0], href: n[1], icon: ICONS[n[0]], style: 'display:flex;align-items:center;gap:12px;min-height:44px;padding:0 12px;border-radius:8px;text-decoration:none;font-size:14px;' + (on ? 'background:#0F766E;color:#FFFFFF;font-weight:600' : 'color:#CFE7E3') };
    });
    var rows = [
      ['Cutting',310,336,'Material (MS plate)'],
      ['Machining',652,588,'CNC-03 down · 1 operator absent'],
      ['Welding',428,364,'2 welders absent'],
      ['Fabrication',300,336,'—'],
      ['Painting',190,240,'—'],
      ['Quality check',212,216,'Rework inspection'],
      ['Dispatch',60,96,'—']
    ].map(function (r) {
      var load = Math.round(r[1] / r[2] * 100), gap = r[1] - r[2];
      return { dept: r[0], req: r[1], avail: r[2], load: load + '%', bar: Math.min(load, 100) + '%',
        color: load > 100 ? '#C2410C' : load > 90 ? '#D97706' : '#0F766E',
        gap: gap > 0 ? '+' + gap + ' h' : '—', tone: gap > 0 ? '#A12A1C' : '#55605F', why: r[3] };
    });
    var on = (this.state && this.state.on) || {};
    var defs = [
      ['ot','Overtime 2 h/day','Machining + Welding, 6 days',72],
      ['shiftc','Add Shift C (Machining)','4 operators, 3 nights',60],
      ['contract','Contract welders','2 welders, 4 days',32],
      ['outsource','Outsource machining','SO-[1047], 120 parts',24]
    ];
    var recovered = 0;
    var levers = defs.map(function (d) {
      var sel = !!on[d[0]];
      if (sel) recovered += d[3];
      return { name: d[1], detail: d[2], hrs: d[3], on: sel ? 'true' : 'false',
        toggle: function () { var n = Object.assign({}, on); n[d[0]] = !sel; self.setState({ on: n }); },
        style: 'display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left;padding:14px;border-radius:8px;font:inherit;cursor:pointer;min-height:44px;background:' + (sel ? '#E6F4F1' : '#fff') + ';border:' + (sel ? '2px solid #0F766E' : '1px solid #C3CFCD') };
    });
    var verdict = recovered >= 142 ? 'Gap closed — all orders can ship on revised dates.' : recovered === 0 ? 'Select levers to see the effect on order ETAs.' : (142 - recovered) + ' h still short — SO-[1042] stays late by about ' + Math.ceil((142 - recovered) / 40) + ' day(s).';
    return {
      nav: nav,
      rows: rows,
      people: [{ skill: 'Welders (certified)', gap: '−2 today' }, { skill: 'CNC operators', gap: '−1 today' }, { skill: 'Quality inspectors', gap: '0' }],
      material: [{ name: 'MS plate 6 mm', gap: '−1.5 t', note: 'PO [4500…] due [21 Nov]' }, { name: 'Welding wire ER70S-6', gap: '−40 kg', note: 'No open PO' }, { name: 'Primer grey', gap: 'OK', note: '—' }],
      mach: [{ name: 'CNC-03', note: 'Down · ETA fix 2 h' }, { name: 'Weld-R2', note: 'Fault · 15 min' }, { name: 'Press-02', note: 'Idle · no material' }],
      levers: levers,
      recovered: recovered,
      verdict: verdict
    };
  }
}

dcMount("<div style=\"box-sizing: border-box; min-height: 1280px; display: flex; flex-wrap: wrap; align-items: stretch; background: #F2F6F5; font-family: Inter, system-ui, sans-serif; color: #102A28\">\n\n  <nav aria-label=\"Main\" style=\"flex: 1 1 220px; box-sizing: border-box; background: #0B3B39; padding: 24px 16px; display: flex; flex-direction: column; gap: 4px\">\n    <div style=\"display: flex; align-items: center; gap: 10px; padding: 0 8px 20px\">\n      <div style=\"width: 36px; height: 36px; border-radius: 8px; background: #134E4A; border: 1px dashed #5FA8A0; display: flex; align-items: center; justify-content: center; font-size: 10px; color: #CFE7E3\">LOGO<\/div>\n      <div style=\"display: flex; flex-direction: column; gap: 2px\">\n        <div style=\"font-weight: 700; font-size: 15px; color: #FFFFFF\">Production Tower<\/div>\n        <div style=\"font-size: 11px; color: #9CCFC7\">Powered by itTrident<\/div>\n      <\/div>\n    <\/div>\n    <sc-for list=\"{{nav}}\" as=\"item\" hint-placeholder-count=\"6\">\n      <a href=\"{{item.href}}\" style=\"{{item.style}}\"><svg aria-hidden=\"true\" width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"{{item.icon}}\"><\/path><\/svg><span>{{item.label}}<\/span><\/a>\n    <\/sc-for>\n  <\/nav>\n\n  <main style=\"flex: 999 1 560px; min-width: 0; box-sizing: border-box; padding: 28px 32px; display: flex; flex-direction: column; gap: 20px\">\n    <div style=\"display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; margin: -28px -32px 4px; padding: 12px 32px; background: #FFFFFF; border-bottom: 1px solid #DCE4E3\">\n      <div style=\"display: flex; align-items: center; gap: 8px; flex: 1 1 260px; max-width: 440px; height: 40px; padding: 0 12px; border: 1px solid #DCE4E3; border-radius: 8px; background: #F2F6F5; color: #637170\">\n        <svg aria-hidden=\"true\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\"><path d=\"M11 18a7 7 0 1 0 0-14 7 7 0 0 0 0 14zM21 21l-5-5\"><\/path><\/svg>\n        <input type=\"search\" aria-label=\"Search orders, machines and materials\" placeholder=\"Search orders, machines, materials…\" style=\"flex: 1; min-width: 0; height: 36px; border: 0; background: transparent; font: inherit; font-size: 13px; color: #102A28\">\n      <\/div>\n      <div style=\"display: flex; flex-wrap: wrap; align-items: center; gap: 12px\">\n        <span style=\"font-size: 12px; font-weight: 500; color: #115E59; background: #E6F4F1; border-radius: 999px; padding: 6px 12px\">[Plant name] · Shift B · 14:00–22:00<\/span>\n        <button aria-label=\"Notifications, 5 new\" style=\"position: relative; width: 44px; height: 44px; border-radius: 8px; border: 1px solid #DCE4E3; background: #FFFFFF; color: #33403F; display: flex; align-items: center; justify-content: center; cursor: pointer\">\n          <svg aria-hidden=\"true\" width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9M10.3 21a1.9 1.9 0 0 0 3.4 0\"><\/path><\/svg>\n          <span style=\"position: absolute; top: 5px; right: 5px; min-width: 16px; height: 16px; border-radius: 999px; background: #B42318; color: #FFFFFF; font-size: 10px; font-weight: 700; display: flex; align-items: center; justify-content: center\">5<\/span>\n        <\/button>\n        <div style=\"display: flex; align-items: center; gap: 8px\">\n          <span aria-hidden=\"true\" style=\"width: 36px; height: 36px; border-radius: 50%; background: #0F766E; color: #FFFFFF; font-size: 13px; font-weight: 600; display: flex; align-items: center; justify-content: center\">PH<\/span>\n          <span style=\"display: flex; flex-direction: column; font-size: 12px; line-height: 1.3\"><strong style=\"font-size: 13px; color: #102A28\">[User name]<\/strong><span style=\"color: #637170\">Plant head<\/span><\/span>\n        <\/div>\n      <\/div>\n    <\/div>\n\n\n    <header style=\"display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px\">\n      <div>\n        <div style=\"font-size: 13px; color: #55605F\">Week [47] · demand from open orders vs available capacity<\/div>\n        <h1 style=\"margin: 4px 0 0; font-size: 26px; font-weight: 700; letter-spacing: -0.01em\">Capacity &amp; resources<\/h1>\n      <\/div>\n      <label style=\"display: flex; flex-direction: column; font-size: 11px; color: #55605F; gap: 2px\">Horizon\n        <select style=\"height: 36px; border: 1px solid #C3CFCD; border-radius: 6px; padding: 0 10px; font: inherit; font-size: 13px; background: #fff\"><option>This week<\/option><option>Next 2 weeks<\/option><option>Next 4 weeks<\/option><\/select>\n      <\/label>\n    <\/header>\n\n    <section style=\"background: #fff; border: 1px solid #DCE4E3; border-radius: 12px; padding: 18px; display: flex; flex-direction: column; gap: 12px\">\n      <h2 style=\"margin: 0; font-size: 16px\">Hours needed vs hours available<\/h2>\n      <div style=\"overflow-x: auto\">\n        <table style=\"width: 100%; border-collapse: collapse; font-size: 13px; min-width: 860px\">\n          <thead>\n            <tr style=\"text-align: left; color: #55605F; font-size: 12px\">\n              <th style=\"padding: 8px; border-bottom: 1px solid #DCE4E3; font-weight: 500\">Department<\/th>\n              <th style=\"padding: 8px; border-bottom: 1px solid #DCE4E3; font-weight: 500\">Required h<\/th>\n              <th style=\"padding: 8px; border-bottom: 1px solid #DCE4E3; font-weight: 500\">Available h<\/th>\n              <th style=\"padding: 8px; border-bottom: 1px solid #DCE4E3; font-weight: 500; width: 30%\">Load<\/th>\n              <th style=\"padding: 8px; border-bottom: 1px solid #DCE4E3; font-weight: 500\">Extra hours<\/th>\n              <th style=\"padding: 8px; border-bottom: 1px solid #DCE4E3; font-weight: 500\">Constraint<\/th>\n            <\/tr>\n          <\/thead>\n          <tbody>\n            <sc-for list=\"{{rows}}\" as=\"r\" hint-placeholder-count=\"7\">\n              <tr>\n                <td style=\"padding: 10px 8px; border-bottom: 1px solid #EBF0EF; font-weight: 600\">{{r.dept}}<\/td>\n                <td style=\"padding: 10px 8px; border-bottom: 1px solid #EBF0EF\">{{r.req}}<\/td>\n                <td style=\"padding: 10px 8px; border-bottom: 1px solid #EBF0EF\">{{r.avail}}<\/td>\n                <td style=\"padding: 10px 8px; border-bottom: 1px solid #EBF0EF\">\n                  <div style=\"display: flex; align-items: center; gap: 8px\">\n                    <div style=\"flex: 1; height: 8px; background: #EBF0EF; border-radius: 4px\"><div style=\"height: 8px; border-radius: 4px; background: {{r.color}}; width: {{r.bar}}\"><\/div><\/div>\n                    <span style=\"min-width: 40px\">{{r.load}}<\/span>\n                  <\/div>\n                <\/td>\n                <td style=\"padding: 10px 8px; border-bottom: 1px solid #EBF0EF; font-weight: 600; color: {{r.tone}}\">{{r.gap}}<\/td>\n                <td style=\"padding: 10px 8px; border-bottom: 1px solid #EBF0EF\">{{r.why}}<\/td>\n              <\/tr>\n            <\/sc-for>\n          <\/tbody>\n        <\/table>\n      <\/div>\n      <div style=\"font-size: 11px; color: #637170\">Required = Σ (remaining qty × routing std time) + rework. Available = shift roster × machines × expected OEE. Source: SAP PP routings / CM01, HR roster, IoT OEE<\/div>\n    <\/section>\n\n    <div style=\"display: flex; flex-wrap: wrap; gap: 16px\">\n      <section style=\"flex: 1 1 300px; min-width: 0; background: #fff; border: 1px solid #DCE4E3; border-radius: 12px; padding: 18px; display: flex; flex-direction: column; gap: 10px\">\n        <h2 style=\"margin: 0; font-size: 16px\">Manpower shortage<\/h2>\n        <sc-for list=\"{{people}}\" as=\"p\" hint-placeholder-count=\"3\">\n          <div style=\"display: flex; justify-content: space-between; gap: 10px; padding: 8px 0; border-top: 1px solid #EBF0EF; font-size: 13px\">\n            <span>{{p.skill}}<\/span><span style=\"font-weight: 600; color: #A12A1C\">{{p.gap}}<\/span>\n          <\/div>\n        <\/sc-for>\n        <div style=\"font-size: 11px; color: #637170\">Source: HR attendance + skill matrix + department head requests<\/div>\n      <\/section>\n      <section style=\"flex: 1 1 300px; min-width: 0; background: #fff; border: 1px solid #DCE4E3; border-radius: 12px; padding: 18px; display: flex; flex-direction: column; gap: 10px\">\n        <h2 style=\"margin: 0; font-size: 16px\">Material shortage<\/h2>\n        <sc-for list=\"{{material}}\" as=\"m\" hint-placeholder-count=\"3\">\n          <div style=\"display: flex; flex-direction: column; gap: 2px; padding: 8px 0; border-top: 1px solid #EBF0EF; font-size: 13px\">\n            <div style=\"display: flex; justify-content: space-between; gap: 10px\"><span>{{m.name}}<\/span><span style=\"font-weight: 600; color: #A12A1C\">{{m.gap}}<\/span><\/div>\n            <div style=\"font-size: 12px; color: #55605F\">{{m.note}}<\/div>\n          <\/div>\n        <\/sc-for>\n        <div style=\"font-size: 11px; color: #637170\">Source: SAP MM stock (MMBE) vs BOM requirement (MD04)<\/div>\n      <\/section>\n      <section style=\"flex: 1 1 300px; min-width: 0; background: #fff; border: 1px solid #DCE4E3; border-radius: 12px; padding: 18px; display: flex; flex-direction: column; gap: 10px\">\n        <h2 style=\"margin: 0; font-size: 16px\">Machine availability<\/h2>\n        <sc-for list=\"{{mach}}\" as=\"m\" hint-placeholder-count=\"3\">\n          <div style=\"display: flex; justify-content: space-between; gap: 10px; padding: 8px 0; border-top: 1px solid #EBF0EF; font-size: 13px\">\n            <span>{{m.name}}<\/span><span style=\"color: #55605F\">{{m.note}}<\/span>\n          <\/div>\n        <\/sc-for>\n        <div style=\"font-size: 11px; color: #637170\">Source: IoT downtime + SAP PM maintenance orders<\/div>\n      <\/section>\n    <\/div>\n\n    <section style=\"background: #fff; border: 1px solid #DCE4E3; border-radius: 12px; padding: 18px; display: flex; flex-direction: column; gap: 14px\">\n      <div style=\"display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px\">\n        <h2 style=\"margin: 0; font-size: 16px\">Recovery planner (what-if)<\/h2>\n        <span style=\"font-size: 12px; color: #55605F\">Gap to close this week: 142 h<\/span>\n      <\/div>\n      <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px\">\n        <sc-for list=\"{{levers}}\" as=\"l\" hint-placeholder-count=\"4\">\n          <button aria-pressed=\"{{l.on}}\" onClick=\"{{l.toggle}}\" style=\"{{l.style}}\">\n            <span style=\"font-size: 14px; font-weight: 600\">{{l.name}}<\/span>\n            <span style=\"font-size: 12px; color: #55605F\">{{l.detail}}<\/span>\n            <span style=\"font-size: 13px; font-weight: 600; color: #0F766E\">+{{l.hrs}} h · ₹[COST]<\/span>\n          <\/button>\n        <\/sc-for>\n      <\/div>\n      <div style=\"display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; background: #F2F6F5; border-radius: 6px; padding: 14px\">\n        <div style=\"display: flex; flex-direction: column; gap: 4px\">\n          <div style=\"font-size: 14px; font-weight: 600\">Recovered {{recovered}} h of 142 h<\/div>\n          <div style=\"font-size: 13px; color: #33403F\">{{verdict}}<\/div>\n        <\/div>\n        <button style=\"height: 44px; padding: 0 16px; border-radius: 6px; border: 0; background: #0F766E; color: #fff; font: inherit; font-size: 13px; font-weight: 600\">Send plan to supervisors<\/button>\n      <\/div>\n    <\/section>\n    <footer style=\"margin-top: auto; padding-top: 16px; border-top: 1px solid #DCE4E3; font-size: 12px; color: #55605F\">Powered by <strong style=\"color: #102A28\">itTrident<\/strong><\/footer>\n  <\/main>\n<\/div>", Component, document.getElementById('root'));
</script>
