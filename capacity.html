<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Capacity and resources · Production Tower</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F4F4F2}
a{color:#2459D6}a:hover{color:#1A43A6}
</style>
</head>
<body>
<div id="root"></div>
<script src="dc-lite.js"></script>
<script>

class Component extends DCLogic {
  renderVals() {
    var self = this;
    var navItems = [
      ['Plant overview','index.html'],['Orders','orders.html'],['Process board','process-board.html'],['Shop floor','shop-floor.html'],
      ['Quality & wastage','quality.html'],['Capacity & resources','capacity.html'],['Data sources','data-sources.html']
    ];
    var nav = navItems.map(function (n) {
      var on = n[0] === 'Capacity & resources';
      return { label: n[0], href: n[1], style: 'display:flex;align-items:center;min-height:44px;padding:0 12px;border-radius:6px;text-decoration:none;font-size:14px;' + (on ? 'background:#1C1C1A;color:#FFFFFF;font-weight:600' : 'color:#3A3A37') };
    });
    var rows = [
      ['Cutting',310,336,'Material (MS plate)'],
      ['Machining',652,588,'CNC-03 down · 1 operator absent'],
      ['Welding',428,364,'2 welders absent'],
      ['Fabrication',300,336,'—'],
      ['Painting',190,240,'—'],
      ['Quality check',212,216,'Rework inspection'],
      ['Dispatch',60,96,'—']
    ].map(function (r) {
      var load = Math.round(r[1] / r[2] * 100), gap = r[1] - r[2];
      return { dept: r[0], req: r[1], avail: r[2], load: load + '%', bar: Math.min(load, 100) + '%',
        color: load > 100 ? '#C2410C' : load > 90 ? '#D97706' : '#2459D6',
        gap: gap > 0 ? '+' + gap + ' h' : '—', tone: gap > 0 ? '#A12A1C' : '#5E5E5A', why: r[3] };
    });
    var on = (this.state && this.state.on) || {};
    var defs = [
      ['ot','Overtime 2 h/day','Machining + Welding, 6 days',72],
      ['shiftc','Add Shift C (Machining)','4 operators, 3 nights',60],
      ['contract','Contract welders','2 welders, 4 days',32],
      ['outsource','Outsource machining','SO-[1047], 120 parts',24]
    ];
    var recovered = 0;
    var levers = defs.map(function (d) {
      var sel = !!on[d[0]];
      if (sel) recovered += d[3];
      return { name: d[1], detail: d[2], hrs: d[3], on: sel ? 'true' : 'false',
        toggle: function () { var n = Object.assign({}, on); n[d[0]] = !sel; self.setState({ on: n }); },
        style: 'display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left;padding:14px;border-radius:8px;font:inherit;cursor:pointer;min-height:44px;background:' + (sel ? '#EAF0FC' : '#fff') + ';border:' + (sel ? '2px solid #2459D6' : '1px solid #C4C4BF') };
    });
    var verdict = recovered >= 142 ? 'Gap closed — all orders can ship on revised dates.' : recovered === 0 ? 'Select levers to see the effect on order ETAs.' : (142 - recovered) + ' h still short — SO-[1042] stays late by about ' + Math.ceil((142 - recovered) / 40) + ' day(s).';
    return {
      nav: nav,
      rows: rows,
      people: [{ skill: 'Welders (certified)', gap: '−2 today' }, { skill: 'CNC operators', gap: '−1 today' }, { skill: 'Quality inspectors', gap: '0' }],
      material: [{ name: 'MS plate 6 mm', gap: '−1.5 t', note: 'PO [4500…] due [21 Nov]' }, { name: 'Welding wire ER70S-6', gap: '−40 kg', note: 'No open PO' }, { name: 'Primer grey', gap: 'OK', note: '—' }],
      mach: [{ name: 'CNC-03', note: 'Down · ETA fix 2 h' }, { name: 'Weld-R2', note: 'Fault · 15 min' }, { name: 'Press-02', note: 'Idle · no material' }],
      levers: levers,
      recovered: recovered,
      verdict: verdict
    };
  }
}

dcMount("<div style=\"box-sizing: border-box; min-height: 1200px; display: flex; flex-wrap: wrap; align-items: stretch; background: #F4F4F2; font-family: Inter, system-ui, sans-serif; color: #1C1C1A\">\n\n  <nav aria-label=\"Main\" style=\"flex: 1 1 220px; box-sizing: border-box; background: #FFFFFF; border-right: 1px solid #D4D4D0; padding: 24px 16px; display: flex; flex-direction: column; gap: 4px\">\n    <div style=\"display: flex; align-items: center; gap: 10px; padding: 0 8px 20px\">\n      <div style=\"width: 32px; height: 32px; border-radius: 6px; background: #E4E4E0; border: 1px dashed #8A8A85; display: flex; align-items: center; justify-content: center; font-size: 10px; color: #5E5E5A\">LOGO<\/div>\n      <div style=\"display: flex; flex-direction: column; gap: 2px\">\n        <div style=\"font-weight: 700; font-size: 15px\">Production Tower<\/div>\n        <div style=\"font-size: 11px; color: #5E5E5A\">Powered by itTrident<\/div>\n      <\/div>\n    <\/div>\n    <sc-for list=\"{{nav}}\" as=\"item\" hint-placeholder-count=\"6\">\n      <a href=\"{{item.href}}\" style=\"{{item.style}}\">{{item.label}}<\/a>\n    <\/sc-for>\n  <\/nav>\n\n  <main style=\"flex: 999 1 560px; min-width: 0; box-sizing: border-box; padding: 28px 32px; display: flex; flex-direction: column; gap: 20px\">\n\n    <header style=\"display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px\">\n      <div>\n        <div style=\"font-size: 13px; color: #5E5E5A\">Week [47] · demand from open orders vs available capacity<\/div>\n        <h1 style=\"margin: 4px 0 0; font-size: 28px; font-weight: 700\">Capacity &amp; resources<\/h1>\n      <\/div>\n      <label style=\"display: flex; flex-direction: column; font-size: 11px; color: #5E5E5A; gap: 2px\">Horizon\n        <select style=\"height: 36px; border: 1px solid #C4C4BF; border-radius: 6px; padding: 0 10px; font: inherit; font-size: 13px; background: #fff\"><option>This week<\/option><option>Next 2 weeks<\/option><option>Next 4 weeks<\/option><\/select>\n      <\/label>\n    <\/header>\n\n    <section style=\"background: #fff; border: 1px solid #D4D4D0; border-radius: 8px; padding: 18px; display: flex; flex-direction: column; gap: 12px\">\n      <h2 style=\"margin: 0; font-size: 16px\">Hours needed vs hours available<\/h2>\n      <div style=\"overflow-x: auto\">\n        <table style=\"width: 100%; border-collapse: collapse; font-size: 13px; min-width: 860px\">\n          <thead>\n            <tr style=\"text-align: left; color: #5E5E5A; font-size: 12px\">\n              <th style=\"padding: 8px; border-bottom: 1px solid #D4D4D0; font-weight: 500\">Department<\/th>\n              <th style=\"padding: 8px; border-bottom: 1px solid #D4D4D0; font-weight: 500\">Required h<\/th>\n              <th style=\"padding: 8px; border-bottom: 1px solid #D4D4D0; font-weight: 500\">Available h<\/th>\n              <th style=\"padding: 8px; border-bottom: 1px solid #D4D4D0; font-weight: 500; width: 30%\">Load<\/th>\n              <th style=\"padding: 8px; border-bottom: 1px solid #D4D4D0; font-weight: 500\">Extra hours<\/th>\n              <th style=\"padding: 8px; border-bottom: 1px solid #D4D4D0; font-weight: 500\">Constraint<\/th>\n            <\/tr>\n          <\/thead>\n          <tbody>\n            <sc-for list=\"{{rows}}\" as=\"r\" hint-placeholder-count=\"7\">\n              <tr>\n                <td style=\"padding: 10px 8px; border-bottom: 1px solid #ECECE8; font-weight: 600\">{{r.dept}}<\/td>\n                <td style=\"padding: 10px 8px; border-bottom: 1px solid #ECECE8\">{{r.req}}<\/td>\n                <td style=\"padding: 10px 8px; border-bottom: 1px solid #ECECE8\">{{r.avail}}<\/td>\n                <td style=\"padding: 10px 8px; border-bottom: 1px solid #ECECE8\">\n                  <div style=\"display: flex; align-items: center; gap: 8px\">\n                    <div style=\"flex: 1; height: 8px; background: #ECECE8; border-radius: 4px\"><div style=\"height: 8px; border-radius: 4px; background: {{r.color}}; width: {{r.bar}}\"><\/div><\/div>\n                    <span style=\"min-width: 40px\">{{r.load}}<\/span>\n                  <\/div>\n                <\/td>\n                <td style=\"padding: 10px 8px; border-bottom: 1px solid #ECECE8; font-weight: 600; color: {{r.tone}}\">{{r.gap}}<\/td>\n                <td style=\"padding: 10px 8px; border-bottom: 1px solid #ECECE8\">{{r.why}}<\/td>\n              <\/tr>\n            <\/sc-for>\n          <\/tbody>\n        <\/table>\n      <\/div>\n      <div style=\"font-size: 11px; color: #6B6B66\">Required = Σ (remaining qty × routing std time) + rework. Available = shift roster × machines × expected OEE. Source: SAP PP routings / CM01, HR roster, IoT OEE<\/div>\n    <\/section>\n\n    <div style=\"display: flex; flex-wrap: wrap; gap: 16px\">\n      <section style=\"flex: 1 1 300px; min-width: 0; background: #fff; border: 1px solid #D4D4D0; border-radius: 8px; padding: 18px; display: flex; flex-direction: column; gap: 10px\">\n        <h2 style=\"margin: 0; font-size: 16px\">Manpower shortage<\/h2>\n        <sc-for list=\"{{people}}\" as=\"p\" hint-placeholder-count=\"3\">\n          <div style=\"display: flex; justify-content: space-between; gap: 10px; padding: 8px 0; border-top: 1px solid #ECECE8; font-size: 13px\">\n            <span>{{p.skill}}<\/span><span style=\"font-weight: 600; color: #A12A1C\">{{p.gap}}<\/span>\n          <\/div>\n        <\/sc-for>\n        <div style=\"font-size: 11px; color: #6B6B66\">Source: HR attendance + skill matrix + department head requests<\/div>\n      <\/section>\n      <section style=\"flex: 1 1 300px; min-width: 0; background: #fff; border: 1px solid #D4D4D0; border-radius: 8px; padding: 18px; display: flex; flex-direction: column; gap: 10px\">\n        <h2 style=\"margin: 0; font-size: 16px\">Material shortage<\/h2>\n        <sc-for list=\"{{material}}\" as=\"m\" hint-placeholder-count=\"3\">\n          <div style=\"display: flex; flex-direction: column; gap: 2px; padding: 8px 0; border-top: 1px solid #ECECE8; font-size: 13px\">\n            <div style=\"display: flex; justify-content: space-between; gap: 10px\"><span>{{m.name}}<\/span><span style=\"font-weight: 600; color: #A12A1C\">{{m.gap}}<\/span><\/div>\n            <div style=\"font-size: 12px; color: #5E5E5A\">{{m.note}}<\/div>\n          <\/div>\n        <\/sc-for>\n        <div style=\"font-size: 11px; color: #6B6B66\">Source: SAP MM stock (MMBE) vs BOM requirement (MD04)<\/div>\n      <\/section>\n      <section style=\"flex: 1 1 300px; min-width: 0; background: #fff; border: 1px solid #D4D4D0; border-radius: 8px; padding: 18px; display: flex; flex-direction: column; gap: 10px\">\n        <h2 style=\"margin: 0; font-size: 16px\">Machine availability<\/h2>\n        <sc-for list=\"{{mach}}\" as=\"m\" hint-placeholder-count=\"3\">\n          <div style=\"display: flex; justify-content: space-between; gap: 10px; padding: 8px 0; border-top: 1px solid #ECECE8; font-size: 13px\">\n            <span>{{m.name}}<\/span><span style=\"color: #5E5E5A\">{{m.note}}<\/span>\n          <\/div>\n        <\/sc-for>\n        <div style=\"font-size: 11px; color: #6B6B66\">Source: IoT downtime + SAP PM maintenance orders<\/div>\n      <\/section>\n    <\/div>\n\n    <section style=\"background: #fff; border: 1px solid #D4D4D0; border-radius: 8px; padding: 18px; display: flex; flex-direction: column; gap: 14px\">\n      <div style=\"display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px\">\n        <h2 style=\"margin: 0; font-size: 16px\">Recovery planner (what-if)<\/h2>\n        <span style=\"font-size: 12px; color: #5E5E5A\">Gap to close this week: 142 h<\/span>\n      <\/div>\n      <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px\">\n        <sc-for list=\"{{levers}}\" as=\"l\" hint-placeholder-count=\"4\">\n          <button aria-pressed=\"{{l.on}}\" onClick=\"{{l.toggle}}\" style=\"{{l.style}}\">\n            <span style=\"font-size: 14px; font-weight: 600\">{{l.name}}<\/span>\n            <span style=\"font-size: 12px; color: #5E5E5A\">{{l.detail}}<\/span>\n            <span style=\"font-size: 13px; font-weight: 600; color: #2459D6\">+{{l.hrs}} h · ₹[COST]<\/span>\n          <\/button>\n        <\/sc-for>\n      <\/div>\n      <div style=\"display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; background: #F4F4F2; border-radius: 6px; padding: 14px\">\n        <div style=\"display: flex; flex-direction: column; gap: 4px\">\n          <div style=\"font-size: 14px; font-weight: 600\">Recovered {{recovered}} h of 142 h<\/div>\n          <div style=\"font-size: 13px; color: #3A3A37\">{{verdict}}<\/div>\n        <\/div>\n        <button style=\"height: 44px; padding: 0 16px; border-radius: 6px; border: 0; background: #2459D6; color: #fff; font: inherit; font-size: 13px; font-weight: 600\">Send plan to supervisors<\/button>\n      <\/div>\n    <\/section>\n    <footer style=\"margin-top: auto; padding-top: 16px; border-top: 1px solid #D4D4D0; font-size: 12px; color: #5E5E5A\">Powered by <strong style=\"color: #1C1C1A\">itTrident<\/strong><\/footer>\n  <\/main>\n<\/div>", Component, document.getElementById('root'));
</script>
</body>
</html>
