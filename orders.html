class Component extends DCLogic {
  renderVals() {
    var self = this;
    var navItems = [
      ['Plant overview','index.html'],['Orders','orders.html'],['Process board','process-board.html'],['Shop floor','shop-floor.html'],
      ['Quality & wastage','quality.html'],['Capacity & resources','capacity.html'],['Data sources','data-sources.html']
    ];
    var ICONS = {
      'Plant overview': 'M3 3h7v9H3zM14 3h7v5h-7zM14 12h7v9h-7zM3 16h7v5H3z',
      'Orders': 'M9 3h6v3H9zM7 4.5H5V21h14V4.5h-2M9 11h6M9 15h6M9 19h3',
      'Process board': 'M3 4h18v16H3zM3 9.5h18M3 15h18M9 4v16M15 4v16',
      'Shop floor': 'M3 21V10l5 3v-3l5 3v-3l5 3V4h3v17zM7 17h2M12 17h2M17 17h1',
      'Quality & wastage': 'M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6zM9 12l2 2 4-4',
      'Capacity & resources': 'M16 20v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M9 11a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7M22 20v-2a4 4 0 0 0-3-3.9M16 4.1a3.5 3.5 0 0 1 0 6.8',
      'Data sources': 'M12 3c4.4 0 8 1.3 8 3s-3.6 3-8 3-8-1.3-8-3 3.6-3 8-3zM4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3'
    };
    var nav = navItems.map(function (n) {
      var on = n[0] === 'Orders';
      return { label: n[0], href: n[1], icon: ICONS[n[0]], style: 'display:flex;align-items:center;gap:12px;min-height:44px;padding:0 12px;border-radius:8px;text-decoration:none;font-size:14px;' + (on ? 'background:#0F766E;color:#FFFFFF;font-weight:600' : 'color:#CFE7E3') };
    });
    var badge = function (s) {
      var c = s === 'Behind' ? ['#FBE9E7','#A12A1C'] : s === 'At risk' ? ['#FDF0E1','#97470A'] : ['#E7F2EA','#2F6B45'];
      return 'font-size:12px;font-weight:600;padding:4px 8px;border-radius:999px;white-space:nowrap;background:' + c[0] + ';color:' + c[1];
    };
    var data = [
      ['SO-[1042]','[Client A]','[Bracket assy BX-20]','2,400','46%','Machining','1,120 u','[22 Nov]','[29 Nov]','+56 h','Behind'],
      ['SO-[1038]','[Client B]','[Frame FR-8]','1,600','62%','Welding','640 u','[25 Nov]','[27 Nov]','+32 h','Behind'],
      ['SO-[1051]','[Client C]','[Housing H-3]','900','35%','Cutting','380 u','[28 Nov]','[30 Nov]','+24 h','At risk'],
      ['SO-[1047]','[Client A]','[Panel P-12]','1,200','28%','Machining','210 u','[02 Dec]','[03 Dec]','+14 h','At risk'],
      ['SO-[1055]','[Client D]','[Shaft S-40]','600','12%','Cutting','90 u','[05 Dec]','[05 Dec]','+6 h','At risk'],
      ['SO-[1040]','[Client B]','[Cover C-2]','3,000','81%','Painting','—','[26 Nov]','[25 Nov]','—','On track'],
      ['SO-[1044]','[Client C]','[Base plate BP-1]','1,500','74%','Quality check','—','[27 Nov]','[26 Nov]','—','On track'],
      ['SO-[1049]','[Client D]','[Bracket BX-9]','800','55%','Fabrication','—','[30 Nov]','[29 Nov]','—','On track'],
      ['SO-[1052]','[Client A]','[Guard G-6]','450','40%','Welding','—','[04 Dec]','[03 Dec]','—','On track'],
      ['SO-[1036]','[Client B]','[Rail R-30]','2,000','97%','Dispatch','—','[21 Nov]','[21 Nov]','—','On track']
    ];
    var journeys = {
      'SO-[1042]': ['DHPPPPN','Machining · on hold (machine down)'],
      'SO-[1038]': ['DDRPPPN','Welding · at risk (porosity rework)'],
      'SO-[1051]': ['RPPXPPN','Cutting · at risk (material short)'],
      'SO-[1047]': ['DRPPPPN','Machining · at risk (queued)'],
      'SO-[1055]': ['PPXXXPN','Cutting · in progress'],
      'SO-[1040]': ['DXXDPPN','Painting · in progress'],
      'SO-[1044]': ['DDDXDHN','Quality check · on hold (client decision)'],
      'SO-[1049]': ['DDDPPPN','Fabrication · in progress'],
      'SO-[1052]': ['DDPPPPN','Welding · in progress'],
      'SO-[1036]': ['DDDDDDP','Dispatch · truck 20:00']
    };
    var dn = ['Cutting','Machining','Welding','Fabrication','Painting','Quality check','Dispatch'];
    var segLook = { D: 'background:#9AA8A7;', P: 'background:#0F766E;', R: 'background:#D97706;', H: 'background:#B42318;', N: 'background:#DCE4E3;', X: 'background:transparent;border:1px dashed #C3CFCD;box-sizing:border-box;' };
    var segName = { D: 'done', P: 'in progress', R: 'at risk', H: 'on hold', N: 'not started', X: 'not in route' };
    var tab = this.state && this.state.tab || 'All';
    var rows = data.filter(function (r) { return tab === 'All' || r[10] === tab; }).map(function (r) {
      var jr = journeys[r[0]];
      var journey = jr[0].split('').map(function (c, i) { return { title: dn[i] + ': ' + segName[c], style: 'display:inline-block;width:18px;height:10px;border-radius:2px;' + segLook[c] }; });
      var tone = jr[1].indexOf('on hold') > -1 ? '#A12A1C' : jr[1].indexOf('at risk') > -1 ? '#97470A' : '#33403F';
      return { id: r[0], client: r[1], product: r[2], qty: r[3], pct: r[4], stage: jr[1], stageTone: tone, journey: journey, behind: r[6], due: r[7], eta: r[8], hrs: r[9], status: r[10], badge: badge(r[10]) };
    });
    var tabs = [['All','24'],['Behind','6'],['At risk','3'],['On track','15']].map(function (t) {
      var on = t[0] === tab;
      return { label: t[0] + ' (' + t[1] + ')', pick: function () { self.setState({ tab: t[0] }); },
        style: 'min-height:44px;padding:0 14px;border-radius:6px;font:inherit;font-size:13px;cursor:pointer;' + (on ? 'background:#102A28;color:#fff;border:1px solid #102A28;font-weight:600' : 'background:#fff;color:#33403F;border:1px solid #C3CFCD') };
    });
    return {
      nav: nav,
      tabs: tabs,
      rows: rows,
      cols: ['Order','Client','Product','Qty','Complete','Department journey','Behind by','Due','Forecast ETA','Extra hrs','Status'],
      clients: [
        { name: '[Client A]', orders: 8, pct: '52%', late: '2 behind' },
        { name: '[Client B]', orders: 6, pct: '71%', late: '1 behind' },
        { name: '[Client C]', orders: 5, pct: '58%', late: '1 at risk' },
        { name: '[Client D]', orders: 5, pct: '39%', late: '1 at risk' }
      ]
    };
  }
}

dcMount("<div style=\"box-sizing: border-box; min-height: 1140px; display: flex; flex-wrap: wrap; align-items: stretch; background: #F2F6F5; font-family: Inter, system-ui, sans-serif; color: #102A28\">\n\n  <nav aria-label=\"Main\" style=\"flex: 1 1 220px; box-sizing: border-box; background: #0B3B39; padding: 24px 16px; display: flex; flex-direction: column; gap: 4px\">\n    <div style=\"display: flex; align-items: center; gap: 10px; padding: 0 8px 20px\">\n      <div style=\"width: 36px; height: 36px; border-radius: 8px; background: #134E4A; border: 1px dashed #5FA8A0; display: flex; align-items: center; justify-content: center; font-size: 10px; color: #CFE7E3\">LOGO<\/div>\n      <div style=\"display: flex; flex-direction: column; gap: 2px\">\n        <div style=\"font-weight: 700; font-size: 15px; color: #FFFFFF\">Production Tower<\/div>\n        <div style=\"font-size: 11px; color: #9CCFC7\">Powered by itTrident<\/div>\n      <\/div>\n    <\/div>\n    <sc-for list=\"{{nav}}\" as=\"item\" hint-placeholder-count=\"6\">\n      <a href=\"{{item.href}}\" style=\"{{item.style}}\"><svg aria-hidden=\"true\" width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"{{item.icon}}\"><\/path><\/svg><span>{{item.label}}<\/span><\/a>\n    <\/sc-for>\n  <\/nav>\n\n  <main style=\"flex: 999 1 560px; min-width: 0; box-sizing: border-box; padding: 28px 32px; display: flex; flex-direction: column; gap: 20px\">\n    <div style=\"display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; margin: -28px -32px 4px; padding: 12px 32px; background: #FFFFFF; border-bottom: 1px solid #DCE4E3\">\n      <div style=\"display: flex; align-items: center; gap: 8px; flex: 1 1 260px; max-width: 440px; height: 40px; padding: 0 12px; border: 1px solid #DCE4E3; border-radius: 8px; background: #F2F6F5; color: #637170\">\n        <svg aria-hidden=\"true\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\"><path d=\"M11 18a7 7 0 1 0 0-14 7 7 0 0 0 0 14zM21 21l-5-5\"><\/path><\/svg>\n        <input type=\"search\" aria-label=\"Search orders, machines and materials\" placeholder=\"Search orders, machines, materials…\" style=\"flex: 1; min-width: 0; height: 36px; border: 0; background: transparent; font: inherit; font-size: 13px; color: #102A28\">\n      <\/div>\n      <div style=\"display: flex; flex-wrap: wrap; align-items: center; gap: 12px\">\n        <span style=\"font-size: 12px; font-weight: 500; color: #115E59; background: #E6F4F1; border-radius: 999px; padding: 6px 12px\">[Plant name] · Shift B · 14:00–22:00<\/span>\n        <button aria-label=\"Notifications, 5 new\" style=\"position: relative; width: 44px; height: 44px; border-radius: 8px; border: 1px solid #DCE4E3; background: #FFFFFF; color: #33403F; display: flex; align-items: center; justify-content: center; cursor: pointer\">\n          <svg aria-hidden=\"true\" width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9M10.3 21a1.9 1.9 0 0 0 3.4 0\"><\/path><\/svg>\n          <span style=\"position: absolute; top: 5px; right: 5px; min-width: 16px; height: 16px; border-radius: 999px; background: #B42318; color: #FFFFFF; font-size: 10px; font-weight: 700; display: flex; align-items: center; justify-content: center\">5<\/span>\n        <\/button>\n        <div style=\"display: flex; align-items: center; gap: 8px\">\n          <span aria-hidden=\"true\" style=\"width: 36px; height: 36px; border-radius: 50%; background: #0F766E; color: #FFFFFF; font-size: 13px; font-weight: 600; display: flex; align-items: center; justify-content: center\">PH<\/span>\n          <span style=\"display: flex; flex-direction: column; font-size: 12px; line-height: 1.3\"><strong style=\"font-size: 13px; color: #102A28\">[User name]<\/strong><span style=\"color: #637170\">Plant head<\/span><\/span>\n        <\/div>\n      <\/div>\n    <\/div>\n\n\n    <header style=\"display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px\">\n      <div>\n        <div style=\"font-size: 13px; color: #55605F\">24 open sales / production orders<\/div>\n        <h1 style=\"margin: 4px 0 0; font-size: 26px; font-weight: 700; letter-spacing: -0.01em\">Orders tracker<\/h1>\n      <\/div>\n      <div style=\"display: flex; gap: 8px; flex-wrap: wrap\">\n        <button style=\"height: 44px; padding: 0 16px; border-radius: 6px; border: 1px solid #C3CFCD; background: #fff; font: inherit; font-size: 13px\">Export to Excel<\/button>\n        <button style=\"height: 44px; padding: 0 16px; border-radius: 6px; border: 0; background: #0F766E; color: #fff; font: inherit; font-size: 13px; font-weight: 600\">Share client update<\/button>\n      <\/div>\n    <\/header>\n\n    <section aria-label=\"Orders by client\" style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px\">\n      <sc-for list=\"{{clients}}\" as=\"c\" hint-placeholder-count=\"4\">\n        <div style=\"background: #fff; border: 1px solid #DCE4E3; border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 6px\">\n          <div style=\"display: flex; justify-content: space-between; font-size: 14px; font-weight: 600\"><span>{{c.name}}<\/span><span style=\"color: #55605F; font-weight: 400; font-size: 12px\">{{c.orders}} orders<\/span><\/div>\n          <div style=\"height: 6px; background: #EBF0EF; border-radius: 3px\"><div style=\"height: 6px; border-radius: 3px; background: #0F766E; width: {{c.pct}}\"><\/div><\/div>\n          <div style=\"font-size: 12px; color: #55605F\">{{c.pct}} delivered · {{c.late}}<\/div>\n        <\/div>\n      <\/sc-for>\n    <\/section>\n\n    <section style=\"background: #fff; border: 1px solid #DCE4E3; border-radius: 12px; padding: 18px; display: flex; flex-direction: column; gap: 14px\">\n      <div style=\"display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; justify-content: space-between\">\n        <div role=\"tablist\" aria-label=\"Status filter\" style=\"display: flex; flex-wrap: wrap; gap: 6px\">\n          <sc-for list=\"{{tabs}}\" as=\"t\" hint-placeholder-count=\"5\">\n            <button role=\"tab\" onClick=\"{{t.pick}}\" style=\"{{t.style}}\">{{t.label}}<\/button>\n          <\/sc-for>\n        <\/div>\n        <div style=\"display: flex; flex-wrap: wrap; gap: 8px; align-items: flex-end\">\n          <label style=\"display: flex; flex-direction: column; font-size: 11px; color: #55605F; gap: 2px\">Search\n            <input type=\"search\" placeholder=\"Order, client, material…\" style=\"height: 36px; width: 220px; border: 1px solid #C3CFCD; border-radius: 6px; padding: 0 10px; font: inherit; font-size: 13px\">\n          <\/label>\n          <label style=\"display: flex; flex-direction: column; font-size: 11px; color: #55605F; gap: 2px\">Client\n            <select style=\"height: 36px; border: 1px solid #C3CFCD; border-radius: 6px; padding: 0 10px; font: inherit; font-size: 13px; background: #fff\"><option>All<\/option><\/select>\n          <\/label>\n          <label style=\"display: flex; flex-direction: column; font-size: 11px; color: #55605F; gap: 2px\">Department\n            <select style=\"height: 36px; border: 1px solid #C3CFCD; border-radius: 6px; padding: 0 10px; font: inherit; font-size: 13px; background: #fff\"><option>All<\/option><\/select>\n          <\/label>\n          <label style=\"display: flex; flex-direction: column; font-size: 11px; color: #55605F; gap: 2px\">Due\n            <select style=\"height: 36px; border: 1px solid #C3CFCD; border-radius: 6px; padding: 0 10px; font: inherit; font-size: 13px; background: #fff\"><option>Next 30 days<\/option><\/select>\n          <\/label>\n        <\/div>\n      <\/div>\n\n      <div style=\"overflow-x: auto\">\n        <table style=\"width: 100%; border-collapse: collapse; font-size: 13px; min-width: 1080px\">\n          <thead>\n            <tr style=\"text-align: left; color: #55605F; font-size: 12px\">\n              <sc-for list=\"{{cols}}\" as=\"h\" hint-placeholder-count=\"11\">\n                <th style=\"padding: 8px; border-bottom: 1px solid #DCE4E3; font-weight: 500; white-space: nowrap\">{{h}}<\/th>\n              <\/sc-for>\n            <\/tr>\n          <\/thead>\n          <tbody>\n            <sc-for list=\"{{rows}}\" as=\"o\" hint-placeholder-count=\"10\">\n              <tr>\n                <td style=\"padding: 12px 8px; border-bottom: 1px solid #EBF0EF; white-space: nowrap\"><a href=\"order-detail.html\">{{o.id}}<\/a><\/td>\n                <td style=\"padding: 12px 8px; border-bottom: 1px solid #EBF0EF\">{{o.client}}<\/td>\n                <td style=\"padding: 12px 8px; border-bottom: 1px solid #EBF0EF\">{{o.product}}<\/td>\n                <td style=\"padding: 12px 8px; border-bottom: 1px solid #EBF0EF; white-space: nowrap\">{{o.qty}}<\/td>\n                <td style=\"padding: 12px 8px; border-bottom: 1px solid #EBF0EF\">\n                  <div style=\"display: flex; align-items: center; gap: 8px\">\n                    <div style=\"width: 70px; height: 6px; background: #EBF0EF; border-radius: 3px\"><div style=\"height: 6px; border-radius: 3px; background: #0F766E; width: {{o.pct}}\"><\/div><\/div>\n                    <span>{{o.pct}}<\/span>\n                  <\/div>\n                <\/td>\n                <td style=\"padding: 12px 8px; border-bottom: 1px solid #EBF0EF\">\n                  <a href=\"process-board.html\" style=\"display: flex; flex-direction: column; gap: 4px; text-decoration: none; color: #102A28\">\n                    <span style=\"display: flex; gap: 3px\">\n                      <sc-for list=\"{{o.journey}}\" as=\"s\" hint-placeholder-count=\"7\">\n                        <span title=\"{{s.title}}\" style=\"{{s.style}}\"><\/span>\n                      <\/sc-for>\n                    <\/span>\n                    <span style=\"font-size: 12px; color: {{o.stageTone}}\">{{o.stage}}<\/span>\n                  <\/a>\n                <\/td>\n                <td style=\"padding: 12px 8px; border-bottom: 1px solid #EBF0EF; white-space: nowrap\">{{o.behind}}<\/td>\n                <td style=\"padding: 12px 8px; border-bottom: 1px solid #EBF0EF; white-space: nowrap\">{{o.due}}<\/td>\n                <td style=\"padding: 12px 8px; border-bottom: 1px solid #EBF0EF; white-space: nowrap\">{{o.eta}}<\/td>\n                <td style=\"padding: 12px 8px; border-bottom: 1px solid #EBF0EF\">{{o.hrs}}<\/td>\n                <td style=\"padding: 12px 8px; border-bottom: 1px solid #EBF0EF\"><span style=\"{{o.badge}}\">{{o.status}}<\/span><\/td>\n              <\/tr>\n            <\/sc-for>\n          <\/tbody>\n        <\/table>\n      <\/div>\n      <div style=\"display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px; font-size: 12px; color: #55605F\">\n        <span>Journey = Cutting → Machining → Welding → Fabrication → Painting → Quality check → Dispatch. Grey done · teal in progress · amber at risk · red on hold · light grey not started · gap = not in this product's route. Behind by = planned qty to date − confirmed qty. ETA = remaining qty ÷ run rate, adjusted by department commitments.<\/span>\n        <span>Showing 10 of 24 · <a href=\"#\">Next page<\/a><\/span>\n      <\/div>\n    <\/section>\n    <footer style=\"margin-top: auto; padding-top: 16px; border-top: 1px solid #DCE4E3; font-size: 12px; color: #55605F\">Powered by <strong style=\"color: #102A28\">itTrident<\/strong><\/footer>\n  <\/main>\n<\/div>", Component, document.getElementById('root'));
</script>
