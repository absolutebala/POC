<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Shop floor and stages · Production Tower</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F4F4F2}
a{color:#2459D6}a:hover{color:#1A43A6}
</style>
</head>
<body>
<div id="root"></div>
<script src="dc-lite.js"></script>
<script>

class Component extends DCLogic {
  renderVals() {
    var navItems = [
      ['Plant overview','index.html'],['Orders','orders.html'],['Process board','process-board.html'],['Shop floor','shop-floor.html'],
      ['Quality & wastage','quality.html'],['Capacity & resources','capacity.html'],['Data sources','data-sources.html']
    ];
    var nav = navItems.map(function (n) {
      var on = n[0] === 'Shop floor';
      return { label: n[0], href: n[1], style: 'display:flex;align-items:center;min-height:44px;padding:0 12px;border-radius:6px;text-decoration:none;font-size:14px;' + (on ? 'background:#1C1C1A;color:#FFFFFF;font-weight:600' : 'color:#3A3A37') };
    });
    var red = '#A12A1C', amb = '#97470A', grn = '#2F6B45', mut = '#5E5E5A';
    var depts = [
      { name: 'Cutting', target: 420, actual: 390, ops: '6/6', mc: '3/3', flag: 'OK', tone: grn,
        cards: [{ id: 'SO-[1051]', client: '[Client C]', qty: '380 u left', note: 'Material short — MS plate', tone: red }, { id: 'SO-[1055]', client: '[Client D]', qty: '510 u left', note: 'On plan', tone: mut }] },
      { name: 'Machining', target: 380, actual: 248, ops: '8/9', mc: '5/6', flag: 'BOTTLENECK', tone: red,
        cards: [{ id: 'SO-[1042]', client: '[Client A]', qty: '260 WIP', note: 'CNC-03 down 42 min', tone: red }, { id: 'SO-[1047]', client: '[Client A]', qty: '120 WIP', note: 'Queued 6 h', tone: amb }] },
      { name: 'Welding', target: 300, actual: 231, ops: '5/7', mc: '2/3', flag: 'SHORT STAFF', tone: amb,
        cards: [{ id: 'SO-[1038]', client: '[Client B]', qty: '140 WIP', note: 'Porosity defects ↑', tone: amb }, { id: 'SO-[1052]', client: '[Client A]', qty: '60 WIP', note: 'On plan', tone: mut }] },
      { name: 'Fabrication', target: 260, actual: 240, ops: '6/6', mc: '—', flag: 'OK', tone: grn,
        cards: [{ id: 'SO-[1049]', client: '[Client D]', qty: '80 WIP', note: 'On plan', tone: mut }] },
      { name: 'Painting', target: 280, actual: 262, ops: '4/4', mc: '1/1', flag: 'OK', tone: grn,
        cards: [{ id: 'SO-[1040]', client: '[Client B]', qty: '210 WIP', note: 'Curing 2 h', tone: mut }] },
      { name: 'Quality check', target: 300, actual: 270, ops: '3/3', mc: '—', flag: 'OK', tone: grn,
        cards: [{ id: 'SO-[1044]', client: '[Client C]', qty: '90 WIP', note: '4 on hold', tone: amb }] },
      { name: 'Dispatch', target: 2, actual: 1, ops: '2/2', mc: '—', flag: 'OK', tone: grn,
        cards: [{ id: 'SO-[1036]', client: '[Client B]', qty: '1 truck', note: 'Leaves 20:00', tone: mut }] }
    ].map(function (d, i) {
      var heads = [
        ['17:52','MS plate runs out by morning. Need 1.5 t by 10:00.'],
        ['18:05','CNC-03 back by 19:00. Requesting Shift C.'],
        ['17:58','2 welders absent. Wire batch changed for porosity.'],
        ['17:40','Idle risk tomorrow if Welding stays behind.'],
        ['Due 18:30','No update yet.'],
        ['17:55','4 units on hold for client decision.'],
        ['17:30','Truck at 20:00. Invoice pending.']
      ];
      d.pct = Math.round(d.actual / d.target * 100) + '%';
      var hand = ['No incoming handoffs','Sent 120 to Welding · 2 pcs gap flagged','Incoming: 118 accepted · 80 sent to Fabrication','1 handoff to accept (80 from Welding)','No incoming handoffs','4 pcs gap on SO-[1044] receipt','400 accepted from Quality check'];
      d.headTime = heads[i][0];
      d.headNote = heads[i][1];
      d.handoffs = hand[i];
      d.handTone = /gap|to accept/.test(hand[i]) ? '#97470A' : '#5E5E5A';
      return d;
    });
    var mc = { Running: '#2F7D4F', Idle: '#B8B8B2', Down: '#B42318' };
    var machines = [
      ['CNC-01','Machining','Running','SO-[1042]','212','48 s','82%','Spindle 61 °C','—'],
      ['CNC-02','Machining','Running','SO-[1047]','186','51 s','76%','Spindle 58 °C','—'],
      ['CNC-03','Machining','Down','SO-[1042]','64','—','0%','Spindle 92 °C','Overheat · 42 min'],
      ['Laser-01','Cutting','Running','SO-[1055]','340','22 s','88%','Power 4.1 kW','—'],
      ['Press-02','Cutting','Idle','—','0','—','—','—','No material · 25 min'],
      ['Weld-R1','Welding','Running','SO-[1038]','118','95 s','71%','Current 210 A','—'],
      ['Weld-R2','Welding','Down','SO-[1052]','40','—','0%','Wire feed fault','Fault · 15 min'],
      ['Paint-L1','Painting','Running','SO-[1040]','262','—','68%','Oven 180 °C','—']
    ].map(function (m) { return { name: m[0], dept: m[1], state: m[2], order: m[3], count: m[4], cycle: m[5], oee: m[6], sensor: m[7], stop: m[8], color: mc[m[2]] }; });
    return {
      nav: nav,
      depts: depts,
      mcols: ['Machine','Department','State','Running order','Count (shift)','Cycle time','OEE','Key sensor','Last stop'],
      machines: machines
    };
  }
}

dcMount("<div style=\"box-sizing: border-box; min-height: 1160px; display: flex; flex-wrap: wrap; align-items: stretch; background: #F4F4F2; font-family: Inter, system-ui, sans-serif; color: #1C1C1A\">\n\n  <nav aria-label=\"Main\" style=\"flex: 1 1 220px; box-sizing: border-box; background: #FFFFFF; border-right: 1px solid #D4D4D0; padding: 24px 16px; display: flex; flex-direction: column; gap: 4px\">\n    <div style=\"display: flex; align-items: center; gap: 10px; padding: 0 8px 20px\">\n      <div style=\"width: 32px; height: 32px; border-radius: 6px; background: #E4E4E0; border: 1px dashed #8A8A85; display: flex; align-items: center; justify-content: center; font-size: 10px; color: #5E5E5A\">LOGO<\/div>\n      <div style=\"display: flex; flex-direction: column; gap: 2px\">\n        <div style=\"font-weight: 700; font-size: 15px\">Production Tower<\/div>\n        <div style=\"font-size: 11px; color: #5E5E5A\">Powered by itTrident<\/div>\n      <\/div>\n    <\/div>\n    <sc-for list=\"{{nav}}\" as=\"item\" hint-placeholder-count=\"6\">\n      <a href=\"{{item.href}}\" style=\"{{item.style}}\">{{item.label}}<\/a>\n    <\/sc-for>\n  <\/nav>\n\n  <main style=\"flex: 999 1 560px; min-width: 0; box-sizing: border-box; padding: 28px 32px; display: flex; flex-direction: column; gap: 20px\">\n\n    <header style=\"display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px\">\n      <div>\n        <div style=\"font-size: 13px; color: #5E5E5A\">Work in progress across departments · Shift B<\/div>\n        <h1 style=\"margin: 4px 0 0; font-size: 28px; font-weight: 700\">Shop floor &amp; stages<\/h1>\n      <\/div>\n      <div style=\"display: flex; gap: 8px; flex-wrap: wrap; align-items: flex-end\">\n        <label style=\"display: flex; flex-direction: column; font-size: 11px; color: #5E5E5A; gap: 2px\">Shift\n          <select style=\"height: 36px; border: 1px solid #C4C4BF; border-radius: 6px; padding: 0 10px; font: inherit; font-size: 13px; background: #fff\"><option>Shift B (current)<\/option><option>Shift A<\/option><option>Shift C<\/option><\/select>\n        <\/label>\n        <button style=\"height: 44px; padding: 0 16px; border-radius: 6px; border: 1px solid #C4C4BF; background: #fff; font: inherit; font-size: 13px\">TV / Andon mode<\/button>\n      <\/div>\n    <\/header>\n\n    <section aria-label=\"Department board\" style=\"display: flex; gap: 12px; overflow-x: auto; padding-bottom: 6px\">\n      <sc-for list=\"{{depts}}\" as=\"d\" hint-placeholder-count=\"7\">\n        <div style=\"flex: 1 0 200px; background: #fff; border: 1px solid #D4D4D0; border-radius: 8px; padding: 12px; display: flex; flex-direction: column; gap: 10px\">\n          <div style=\"display: flex; justify-content: space-between; align-items: center\">\n            <h2 style=\"margin: 0; font-size: 14px\">{{d.name}}<\/h2>\n            <span style=\"font-size: 11px; font-weight: 600; color: {{d.tone}}\">{{d.flag}}<\/span>\n          <\/div>\n          <div style=\"font-size: 12px; color: #5E5E5A\">Today {{d.actual}} / {{d.target}} units<\/div>\n          <div style=\"height: 6px; background: #ECECE8; border-radius: 3px\"><div style=\"height: 6px; border-radius: 3px; background: #2459D6; width: {{d.pct}}\"><\/div><\/div>\n          <div style=\"font-size: 12px; color: #5E5E5A\">Operators {{d.ops}} · Machines {{d.mc}}<\/div>\n          <a href=\"process-board.html\" style=\"display: flex; flex-direction: column; gap: 2px; text-decoration: none; color: #1C1C1A; background: #EEF3FD; border-radius: 6px; padding: 8px\">\n            <span style=\"font-size: 11px; color: #3A3A37\">Shift update · {{d.headTime}}<\/span>\n            <span style=\"font-size: 12px; line-height: 1.4\">{{d.headNote}}<\/span>\n          <\/a>\n          <div style=\"font-size: 12px; color: {{d.handTone}}\">{{d.handoffs}}<\/div>\n          <sc-for list=\"{{d.cards}}\" as=\"c\" hint-placeholder-count=\"2\">\n            <a href=\"order-detail.html\" style=\"display: block; text-decoration: none; color: #1C1C1A; border: 1px solid #D4D4D0; border-radius: 6px; padding: 10px; background: #FAFAF8\">\n              <div style=\"font-size: 13px; font-weight: 600\">{{c.id}}<\/div>\n              <div style=\"font-size: 12px; color: #5E5E5A\">{{c.client}} · {{c.qty}}<\/div>\n              <div style=\"font-size: 11px; color: {{c.tone}}; margin-top: 4px\">{{c.note}}<\/div>\n            <\/a>\n          <\/sc-for>\n        <\/div>\n      <\/sc-for>\n    <\/section>\n    <div style=\"font-size: 11px; color: #6B6B66; margin-top: -10px\">Cards = production orders currently at that operation. Source: SAP PP order status + operation confirmations; targets from daily dispatch plan; shift updates and handoffs from the department head app<\/div>\n\n    <section style=\"background: #fff; border: 1px solid #D4D4D0; border-radius: 8px; padding: 18px; display: flex; flex-direction: column; gap: 12px\">\n      <div style=\"display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px\">\n        <h2 style=\"margin: 0; font-size: 16px\">Machines (IoT)<\/h2>\n        <span style=\"font-size: 12px; color: #6B6B66\">Shown only where machines are connected; otherwise status comes from operator entry<\/span>\n      <\/div>\n      <div style=\"overflow-x: auto\">\n        <table style=\"width: 100%; border-collapse: collapse; font-size: 13px; min-width: 900px\">\n          <thead>\n            <tr style=\"text-align: left; color: #5E5E5A; font-size: 12px\">\n              <sc-for list=\"{{mcols}}\" as=\"h\" hint-placeholder-count=\"9\">\n                <th style=\"padding: 8px; border-bottom: 1px solid #D4D4D0; font-weight: 500; white-space: nowrap\">{{h}}<\/th>\n              <\/sc-for>\n            <\/tr>\n          <\/thead>\n          <tbody>\n            <sc-for list=\"{{machines}}\" as=\"m\" hint-placeholder-count=\"8\">\n              <tr>\n                <td style=\"padding: 10px 8px; border-bottom: 1px solid #ECECE8; font-weight: 600\">{{m.name}}<\/td>\n                <td style=\"padding: 10px 8px; border-bottom: 1px solid #ECECE8\">{{m.dept}}<\/td>\n                <td style=\"padding: 10px 8px; border-bottom: 1px solid #ECECE8\"><span style=\"display: inline-flex; align-items: center; gap: 6px\"><span style=\"width: 10px; height: 10px; border-radius: 50%; background: {{m.color}}\"><\/span>{{m.state}}<\/span><\/td>\n                <td style=\"padding: 10px 8px; border-bottom: 1px solid #ECECE8\">{{m.order}}<\/td>\n                <td style=\"padding: 10px 8px; border-bottom: 1px solid #ECECE8\">{{m.count}}<\/td>\n                <td style=\"padding: 10px 8px; border-bottom: 1px solid #ECECE8\">{{m.cycle}}<\/td>\n                <td style=\"padding: 10px 8px; border-bottom: 1px solid #ECECE8\">{{m.oee}}<\/td>\n                <td style=\"padding: 10px 8px; border-bottom: 1px solid #ECECE8\">{{m.sensor}}<\/td>\n                <td style=\"padding: 10px 8px; border-bottom: 1px solid #ECECE8\">{{m.stop}}<\/td>\n              <\/tr>\n            <\/sc-for>\n          <\/tbody>\n        <\/table>\n      <\/div>\n    <\/section>\n\n    <section style=\"background: #fff; border: 1px dashed #8A8A85; border-radius: 8px; padding: 18px; display: flex; flex-wrap: wrap; gap: 16px; align-items: center; justify-content: space-between\">\n      <div style=\"display: flex; flex-direction: column; gap: 4px; max-width: 720px\">\n        <h2 style=\"margin: 0; font-size: 15px\">No IoT on a line? Operator entry fallback<\/h2>\n        <div style=\"font-size: 13px; color: #3A3A37; line-height: 1.5\">Supervisor logs hourly count, scrap and downtime reason from a tablet; entries post to SAP as confirmations.<\/div>\n      <\/div>\n      <button style=\"height: 44px; padding: 0 16px; border-radius: 6px; border: 0; background: #2459D6; color: #fff; font: inherit; font-size: 13px; font-weight: 600\">Log hourly output<\/button>\n    <\/section>\n    <footer style=\"margin-top: auto; padding-top: 16px; border-top: 1px solid #D4D4D0; font-size: 12px; color: #5E5E5A\">Powered by <strong style=\"color: #1C1C1A\">itTrident<\/strong><\/footer>\n  <\/main>\n<\/div>", Component, document.getElementById('root'));
</script>
</body>
</html>
