    var ICONS = {
      'Plant overview': 'M3 3h7v9H3zM14 3h7v5h-7zM14 12h7v9h-7zM3 16h7v5H3z',
      'Orders': 'M9 3h6v3H9zM7 4.5H5V21h14V4.5h-2M9 11h6M9 15h6M9 19h3',
      'Process board': 'M3 4h18v16H3zM3 9.5h18M3 15h18M9 4v16M15 4v16',
      'Shop floor': 'M3 21V10l5 3v-3l5 3v-3l5 3V4h3v17zM7 17h2M12 17h2M17 17h1',
      'Quality & wastage': 'M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6zM9 12l2 2 4-4',
      'Capacity & resources': 'M16 20v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M9 11a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7M22 20v-2a4 4 0 0 0-3-3.9M16 4.1a3.5 3.5 0 0 1 0 6.8',

    };
    var nav = navItems.map(function (n) {
      var on = n[0] === 'Data sources';
      return { label: n[0], href: n[1], icon: ICONS[n[0]], style: 'display:flex;align-items:center;gap:12px;min-height:44px;padding:0 12px;border-radius:8px;text-decoration:none;font-size:14px;' + (on ? 'background:#0F766E;color:#FFFFFF;font-weight:600' : 'color:#CFE7E3') };
    });
    var badge = function (s) {
      var c = s === 'Connected' ? ['#E7F2EA','#2F6B45'] : s === 'Partial' ? ['#FDF0E1','#97470A'] : ['#EEF2F1','#33403F'];
      return 'font-size:12px;font-weight:600;padding:4px 8px;border-radius:999px;white-space:nowrap;background:' + c[0] + ';color:' + c[1];
    };
    var sources = [
      ['SAP SD','Connected','Sales orders, clients, due dates','OData service · read only','Last sync 4 min ago · every 15 min'],
      ['SAP PP','Connected','Production orders, routings, confirmations, scrap','OData / RFC · read only','Last sync 4 min ago · every 5 min'],
      ['SAP MM','Connected','Stock, BOM requirements, purchase orders','OData · read only','Last sync 12 min ago · every 15 min'],
      ['SAP QM','Partial','Quality notifications, defect codes','Defect codes not mapped for Painting','Last sync 4 min ago'],
      ['IoT gateway','Partial','Machine state, counts, cycle time, sensors','MQTT · 18 of 24 machines connected','Live · 2 s latency'],
      ['Department head app','Connected','Shift update per department (status, challenges tagged to orders, requests, next-shift commitment) + handoffs sent / accepted between departments','Tablet / mobile app · once per shift + handoffs as they happen','6 of 7 departments submitted this shift'],

    ].map(function (s) { return { name: s[0], state: s[1], feeds: s[2], how: s[3], sync: s[4], badge: badge(s[1]) }; });
    return {
      nav: nav,
      sources: sources,
      rules: [
        { label: 'Order "at risk" when ETA is within (days of due)', val: '2' },
        { label: 'Scrap alert above (%)', val: '2.5' },
        { label: 'Machine down alert after (minutes)', val: '10' },
        { label: 'Department overload above (% load)', val: '100' }
      ]
    };
  }
}

dcMount("<div style=\"box-sizing: border-box; min-height: 980px; display: flex; flex-wrap: wrap; align-items: stretch; background: #F2F6F5; font-family: Inter, system-ui, sans-serif; color: #102A28\">\n\n  <nav aria-label=\"Main\" style=\"flex: 1 1 220px; box-sizing: border-box; background: #0B3B39; padding: 24px 16px; display: flex; flex-direction: column; gap: 4px\">\n    <div style=\"display: flex; align-items: center; gap: 10px; padding: 0 8px 20px\">\n      <div style=\"width: 36px; height: 36px; border-radius: 8px; background: #134E4A; border: 1px dashed #5FA8A0; display: flex; align-items: center; justify-content: center; font-size: 10px; color: #CFE7E3\">LOGO<\/div>\n      <div style=\"display: flex; flex-direction: column; gap: 2px\">\n        <div style=\"font-weight: 700; font-size: 15px; color: #FFFFFF\">Production Tower<\/div>\n        <div style=\"font-size: 11px; color: #9CCFC7\">Powered by itTrident<\/div>\n      <\/div>\n    <\/div>\n    <sc-for list=\"{{nav}}\" as=\"item\" hint-placeholder-count=\"6\">\n      <a href=\"{{item.href}}\" style=\"{{item.style}}\"><svg aria-hidden=\"true\" width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"{{item.icon}}\"><\/path><\/svg><span>{{item.label}}<\/span><\/a>\n    <\/sc-for>\n  <\/nav>\n\n  <main style=\"flex: 999 1 560px; min-width: 0; box-sizing: border-box; padding: 28px 32px; display: flex; flex-direction: column; gap: 20px\">\n    <div style=\"display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; margin: -28px -32px 4px; padding: 12px 32px; background: #FFFFFF; border-bottom: 1px solid #DCE4E3\">\n      <div style=\"display: flex; align-items: center; gap: 8px; flex: 1 1 260px; max-width: 440px; height: 40px; padding: 0 12px; border: 1px solid #DCE4E3; border-radius: 8px; background: #F2F6F5; color: #637170\">\n        <svg aria-hidden=\"true\" wi -height: 1.3\"><strong style=\"font-size: 13px; color: #102A28\">[User name]<\/strong><span style=\"color: #637170\">Plant head<\/span><\/span>\n        <\/div>\n      <\/div>\n    <\/div>\n\n    <header>\n      <div style=\"font-size: 13px; color: #55605F\">Admin<\/div>\n      <h1 style=\"margin: 4px 0 0; font-size: 26px; font-weight: 700; letter-spacing: -0.01em\">Data sources<\/h1>\n    <\/header>\n\n    <section aria-label=\"Connections\" style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px\">\n      <sc-for list=\"{{sources}}\" as=\"s\" hint-placeholder-count=\"6\">\n        <div style=\"background: #fff; border: 1px solid #DCE4E3; border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 8px\">\n          <div style=\"display: flex; justify-content: space-between; align-items: center; gap: 8px\">\n            <h2 style=\"margin: 0; font-size: 15px\">{{s.name}}<\/h2>\n            <span style=\"{{s.badge}}\">{{s.state}}<\/span>\n          <\/div>\n          <div style=\"font-size: 13px; color: #33403F; line-height: 1.5\">{{s.feeds}}<\/div>\n          <div style=\"font-size: 12px; color: #55605F\">{{s.how}}<\/div>\n          <div style=\"font-size: 12px; color: #55605F; border-top: 1px dashed #DCE4E3; padding-top: 8px\">{{s.sync}}<\/div>\n        <\/div>\n      <\/sc-for>\n    <\/section>\n\n    <section style=\"background: #fff; border: 1px solid #DCE4E3; border-radius: 12px; padding: 18px; display: flex; flex-direction: column; gap: 12px\">\n      <h2 style=\"margin: 0; font-size: 16px\">Data flow<\/h2>\n      <div style=\"display: flex; flex-wrap: wrap; align-items: stretch; gap: 12px\">\n        <div style=\"flex: 1 1 200px; border: 1px solid #C3CFCD; border-radius: 6px; padding: 14px; display: flex; flex-direction: column; gap: 4px\">\n          <div style=\"font-size: 14px; font-weight: 600\">SAP ECC / S/4HANA<\/div>\n          <div style=\"font-size: 12px; color: #55605F\">SD orders · PP orders div>\n      <\/div>\n    <\/section>\n\n    <section style=\"background: #fff; border: 1px solid #DCE4E3; border-radius: 12px; padding: 18px; display: flex; flex-direction: column; gap: 12px\">\n      <h2 style=\"margin: 0; font-size: 16px\">Thresholds &amp; alerts<\/h2>\n      <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px\">\n        <sc-for list=\"{{rules}}\" as=\"r\" hint-placeholder-count=\"4\">\n          <label style=\"display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: #55605F\">{{r.label}}\n            <input type=\"text\" value=\"{{r.val}}\" style=\"height: 40px; border: 1px solid #C3CFCD; border-radius: 6px; padding: 0 10px; font: inherit; font-size: 13px; color: #102A28\">\n          <\/label>\n        <\/sc-for>\n      <\/div>\n    <\/section>\n    <footer style=\"margin-top: auto; padding-top: 16px; border-top: 1px solid #DCE4E3; font-size: 12px; color: #55605F\">Powered by <strong style=\"color: #102A28\">itTrident<\/strong><\/footer>\n  <\/main>\n<\/div>", Component, document.getElementById('root'));
