    };
    var nav = navItems.map(function (n) {
      var on = n[0] === active;
      return { label: n[0], href: n[1], icon: ICONS[n[0]], style: 'display:flex;align-items:center;gap:12px;min-height:44px;padding:0 12px;border-radius:8px;text-decoration:none;font-size:14px;' + (on ? 'background:#0F766E;color:#FFFFFF;font-weight:600' : 'color:#CFE7E3') };

    ].map(function (r, i) {

        { level: 'WARNING', tone: '#97470A', text: 'Machining scrap differs from SAP by 8 units', meta: 'Head confirmed 240 vs SAP 248', src: 'iDataOne' }
      ].map(function (a) { a.srcStyle = srcStyle(a.src); return a; }),

      pdepts: ['Cutting','Machining','Welding','Fabrication','Painting','Quality check','Dispatch'],

        ['SO-[1038]','D D R P P P N',[100,100,64,63,62,62,0]],

le=\"display: flex; flex-wrap: wrap; gap: 16px\">\n      <section style=\"flex: 2 1 520px; min-width: 0; background: #fff; border: 1px solid #DCE4E3; border-radius: 12px; padding: 18px; display: flex; flex-direction: column; gap: 12px\">\n        <div style=\"display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap\">\n          <h2 style=\"margin: 0; font-size: 16px\">Daily output — plan vs actual (14 days)<\/h2>\n          <div style=\"display: flex; gap: 14px; font-size: 12px; color: #55605F\">\n            <span style=\"display: flex; align-items: center; gap: 6px\"><span style=\"width: 10px; height: 10px; background: #C3CFCD; display: inline-block\"><\/span>Plan<\/span>\n            <span style=\"display: flex; align-items: center; gap: 6px\"><span style=\"width: 10px; height: 10px; background: #0F766E; display: inline-block\"><\/span>Actual<\/span>\n          <\/div>\n        <\/div>\n        <div style=\"height: 220px; display: flex; align-items: flex-end; gap: 8px; border-bottom: 1px solid #C3CFCD; padding: 0 4px\">\n          <sc-for list=\"{{days}}\" as=\"d\" hint-placeholder-count=\"14\">\n            <div style=\"flex: 1 1 0; height: 100%; display: flex; align-items: flex-end; gap: 2px\">\n              <div style=\"flex: 1; background: #C3CFCD; height: {{d.plan}}\"><\/div>\n              <div style=\"flex: 1; background: #0F766E; height: {{d.actual}}\"><\/div>\n            <\/div>\n          <\/sc-for>\n        <\/div>\n        <div style=\"font-size: 11px; color: #637170\">Data: plan from SAP PP · actuals from SAP confirmations, IoT counters (live) and department head shift-end confirmations<\/div>\n      <\/section>\n\n      <section style=\"flex: 1 1 300px; min-width: 0; background: #fff; border: 1px solid #DCE4E3; border-radius: 12px; padding: 18px; display: flex; flex-direction: column; gap: 10px\">\n        <div style=\"display: flex; justify-content: space-between; align-items: center\">\n          <h2 style= r-bottom: 1px solid #DCE4E3; font-weight: 500\">Complete<\/th>\n                <th style=\"padding: 8px; border-bottom: 1px solid #DCE4E3; font-weight: 500\">Behind by<\/th>\n                <th style=\"padding: 8px; border-bottom: 1px solid #DCE4E3; font-weight: 500\">Forecast ETA<\/th>\n                <th style=\"padding: 8px; border-bottom: 1px solid #DCE4E3; font-weight: 500\">Latest from floor<\/th>\n                <th style=\"padding: 8px; border-bottom: 1px solid #DCE4E3; font-weight: 500\">Status<\/th>\n              <\/tr>\n            <\/thead>\n            <tbody>\n              <sc-for list=\"{{orders}}\" as=\"o\" hint-placeholder-count=\"5\">\n                <tr>\n                  <td style=\"padding: 10px 8px; border-bottom: 1px solid #EBF0EF\"><a href=\"order-detail.html\">{{o.id}}<\/a><\/td>\n                  <td style=\"padding: 10px 8px; border-bottom: 1px solid #EBF0EF\">{{o.client}}<\/td>\n                  <td style=\"padding: 10px 8px; border-bottom: 1px solid #EBF0EF\">{{o.due}}<\/td>\n                  <td style=\"padding: 10px 8px; border-bottom: 1px solid #EBF0EF\">\n                    <div style=\"display: flex; align-items: center; gap: 8px\">\n                      <div style=\"width: 80px; height: 6px; background: #EBF0EF; border-radius: 3px\"><div style=\"height: 6px; border-radius: 3px; background: #0F766E; width: {{o.pct}}\"><\/div><\/div>\n                      <span>{{o.pct}}<\/span>\n                    <\/div>\n                  <\/td>\n                  <td style=\"padding: 10px 8px; border-bottom: 1px solid #EBF0EF\">{{o.behind}}<\/td>\n                  <td style=\"padding: 10px 8px; border-bottom: 1px solid #EBF0EF\">{{o.eta}}<\/td>\n                  <td style=\"padding: 10px 8px; border-bottom: 1px solid #EBF0EF; font-size: 12px; color: #33403F; min-width: 180px\">{{o.note}}<\/td>\n                  <td style=\"padding: 10px 8px; border-bottom: 1px solid #EBF0EF\"><span style=\"{{o.badge}}\">{{o.status}}<\/span><\/td>\n                <\/tr>\n              <\/sc-for>\n            <\/tbody>\n          <\/table>\n        <\/div>\n      <\/section>\n\n      <section style=\"flex: 1 1 300px; min-width: 0; background: #fff; border: 1px solid #DCE4E3; border-radius: 12px; padding: 18px; display: flex; flex-direction: column; gap: 12px\">\n        <div style=\"display: flex; justify-content: space-between; align-items: center\">\n          <h2 style=\"margin: 0; font-size: 16px\">Load by department<\/h2>\n          <a href=\"shop-floor.html\" style=\"font-size: 13px\">Shop floor →<\/a>\n        <\/div>\n        <sc-for list=\"{{depts}}\" as=\"d\" hint-placeholder-count=\"7\">\n          <div style=\"display: flex; flex-direction: column; gap: 4px\">\n            <div style=\"display: flex; justify-content: space-between; font-size: 13px\"><span>{{d.name}}<\/span><span style=\"display: flex; align-items: center; gap: 8px\"><span style=\"color: #55605F\">{{d.wip}} WIP · {{d.load}}<\/span><span style=\"{{d.hbadge}}\">{{d.hstatus}}<\/span><\/span><\/div>\n            <div style=\"height: 8px; background: #EBF0EF; border-radius: 4px\"><div style=\"height: 8px; border-radius: 4px; background: {{d.color}}; width: {{d.bar}}\"><\/div><\/div>\n          <\/div>\n        <\/sc-for>\n        <div style=\"font-size: 11px; color: #637170\">Load = required hours ÷ available hours this week (SAP PP capacity + HR roster). Status chip = department head's shift update<\/div>\n      <\/section>\n    <\/div>\n\n    <section style=\"background: #fff; border: 1px solid #DCE4E3; border-radius: 12px; padding: 18px; display: flex; flex-direction: column; gap: 12px\">\n      <div style=\"display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px\">\n        <h2 style=\"margin: 0; font-size: 16px\">Where orders stand in each department<\/h2>\n        <span style=\"font-size: 13px; color: #55605F\">5 orders with challenges · 2 handoff gaps · <a href=\"process-board.html\">Process board →<\/a><\/span>\n      <\/div>\n      <div style=\"overflow-x: auto\">\n        <div style=\"min-width: 860px; display: flex; flex-direction: column; gap: 6px\">\n          <div style=\"display: grid; grid-template-columns: 120px repeat(7, minmax(0, 1fr)); gap: 6px; font-size: 12px; color: #55605F\">\n            <span>Order<\/span>\n            <sc-for list=\"{{pdepts}}\" as=\"h\" hint-placeholder-count=\"7\"><span>{{h}}<\/span><\/sc-for>\n          <\/div>\n          <sc-for list=\"{{prows}}\" as=\"r\" hint-placeholder-count=\"5\">\n            <a href=\"process-board.html\" style=\"display: grid; grid-template-columns: 120px repeat(7, minmax(0, 1fr)); gap: 6px; text-decoration: none; color: #102A28; align-items: stretch\">\n              <span style=\"font-size: 13px; font-weight: 600; color: #0F766E; display: flex; align-items: center\">{{r.id}}<\/span>\n              <sc-for list=\"{{r.cells}}\" as=\"c\" hint-placeholder-count=\"7\">\n                <span style=\"{{c.style}}\">{{c.label}}<\/span>\n              <\/sc-for>\n            <\/a>\n          <\/sc-for>\n        <\/div>\n      <\/div>\n      <div style=\"font-size: 11px; color: #637170\">Grey done · teal in progress · amber at risk · red on hold · dashed not started · blank not in route. Status from SAP/IoT and handoffs; challenges from department heads' shift updates.<\/div>\n    <\/section>\n\n    <section style=\"background: #fff; border: 1px solid #DCE4E3; border-radius: 12px; padding: 18px; display: flex; flex-direction: column; gap: 12px\">\n      <div style=\"display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px\">\n        <h2 style=\"margin: 0; font-size: 16px\">Machines — live status<\/h2>\n        <span style=\"font-size: 12px; color: #55605F\">Running 18 · Idle 4 · Down 2 · Source: IoT gateway (OPC UA / MQTT)<\/span>\n      <\/div>\n      <div style=\"display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px\">\n        <sc-for list=\"{{machines}}\" as=\"m\" hint-placeholder-count=\"8\">\n          <div style=\"border: 1px solid #DCE4E3; border-radius: 6px; padding: 10px; display: flex; flex-direction: column; gap: 4px; border-top: 4px solid {{m.color}}\">\n            <div style=\"font-size: 13px; font-weight: 600\">{{m.name}}<\/div>\n            <div style=\"font-size: 12px; color: #33403F\">{{m.state}}<\/div>\n            <div style=\"font-size: 11px; color: #637170\">Utilisation {{m.util}}<\/div>\n          <\/div>\n        <\/sc-for>\n      <\/div>\n    <\/section>\n\n    <footer style=\"margin-top: auto; padding-top: 16px; border-top: 1px solid #DCE4E3; font-size: 12px; color: #55605F\">Powered by <strong style=\"color: #102A28\">itTrident<\/strong><\/footer>\n  <\/main>\n<\/div>", Component, document.getElementById('root'));
