class Component extends DCLogic {
  renderVals() {
    var navItems = [
      ['Plant overview','index.html'],['Orders','orders.html'],['Process board','process-board.html'],['Shop floor','shop-floor.html'],
      ['Quality & wastage','quality.html'],['Capacity & resources','capacity.html'],['Data sources','data-sources.html']
    ];
    var ICONS = {
      'Plant overview': 'M3 3h7v9H3zM14 3h7v5h-7zM14 12h7v9h-7zM3 16h7v5H3z',
      'Orders': 'M9 3h6v3H9zM7 4.5H5V21h14V4.5h-2M9 11h6M9 15h6M9 19h3',
      'Process board': 'M3 4h18v16H3zM3 9.5h18M3 15h18M9 4v16M15 4v16',
      'Shop floor': 'M3 21V10l5 3v-3l5 3v-3l5 3V4h3v17zM7 17h2M12 17h2M17 17h1',
      'Quality & wastage': 'M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6zM9 12l2 2 4-4',
      'Capacity & resources': 'M16 20v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M9 11a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7M22 20v-2a4 4 0 0 0-3-3.9M16 4.1a3.5 3.5 0 0 1 0 6.8',
      'Data sources': 'M12 3c4.4 0 8 1.3 8 3s-3.6 3-8 3-8-1.3-8-3 3.6-3 8-3zM4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3'
    };
    var nav = navItems.map(function (n) {
      var on = n[0] === 'Shop floor';
      return { label: n[0], href: n[1], icon: ICONS[n[0]], style: 'display:flex;align-items:center;gap:12px;min-height:44px;padding:0 12px;border-radius:8px;text-decoration:none;font-size:14px;' + (on ? 'background:#0F766E;color:#FFFFFF;font-weight:600' : 'color:#CFE7E3') };
    });
    var red = '#A12A1C', amb = '#97470A', grn = '#2F6B45', mut = '#55605F';
    var depts = [
      { name: 'Cutting', target: 420, actual: 390, ops: '6/6', mc: '3/3', flag: 'OK', tone: grn,
        cards: [{ id: 'SO-[1051]', client: '[Client C]', qty: '380 u left', note: 'Material short — MS plate', tone: red }, { id: 'SO-[1055]', client: '[Client D]', qty: '510 u left', note: 'On plan', tone: mut }] },
      { name: 'Machining', target: 380, actual: 248, ops: '8/9', mc: '5/6', flag: 'BOTTLENECK', tone: red,
        cards: [{ id: 'SO-[1042]', client: '[Client A]', qty: '260 WIP', note: 'CNC-03 down 42 min', tone: red }, { id: 'SO-[1047]', client: '[Client A]', qty: '120 WIP', note: 'Queued 6 h', tone: amb }] },
      { name: 'Welding', target: 300, actual: 231, ops: '5/7', mc: '2/3', flag: 'SHORT STAFF', tone: amb,
        cards: [{ id: 'SO-[1038]', client: '[Client B]', qty: '140 WIP', note: 'Porosity defects ↑', tone: amb }, { id: 'SO-[1052]', client: '[Client A]', qty: '60 WIP', note: 'On plan', tone: mut }] },
      { name: 'Fabrication', target: 260, actual: 240, ops: '6/6', mc: '—', flag: 'OK', tone: grn,
        cards: [{ id: 'SO-[1049]', client: '[Client D]', qty: '80 WIP', note: 'On plan', tone: mut }] },
      { name: 'Painting', target: 280, actual: 262, ops: '4/4', mc: '1/1', flag: 'OK', tone: grn,
        cards: [{ id: 'SO-[1040]', client: '[Client B]', qty: '210 WIP', note: 'Curing 2 h', tone: mut }] },
      { name: 'Quality check', target: 300, actual: 270, ops: '3/3', mc: '—', flag: 'OK', tone: grn,
        cards: [{ id: 'SO-[1044]', client: '[Client C]', qty: '90 WIP', note: '4 on hold', tone: amb }] },
      { name: 'Dispatch', target: 2, actual: 1, ops: '2/2', mc: '—', flag: 'OK', tone: grn,
        cards: [{ id: 'SO-[1036]', client: '[Client B]', qty: '1 truck', note: 'Leaves 20:00', tone: mut }] }
    ].map(function (d, i) {
      var heads = [
        ['17:52','MS plate runs out by morning. Need 1.5 t by 10:00.'],
        ['18:05','CNC-03 back by 19:00. Requesting Shift C.'],
        ['17:58','2 welders absent. Wire batch changed for porosity.'],
        ['17:40','Idle risk tomorrow if Welding stays behind.'],
        ['Due 18:30','No update yet.'],
        ['17:55','4 units on hold for client decision.'],
        ['17:30','Truck at 20:00. Invoice pending.']
      ];
      d.pct = Math.round(d.actual / d.target * 100) + '%';
      var hand = ['No incoming handoffs','Sent 120 to Welding · 2 pcs gap flagged','Incoming: 118 accepted · 80 sent to Fabrication','1 handoff to accept (80 from Welding)','No incoming handoffs','4 pcs gap on SO-[1044] receipt','400 accepted from Quality check'];
      d.headTime = heads[i][0];
      d.headNote = heads[i][1];
      d.handoffs = hand[i];
      d.handTone = /gap|to accept/.test(hand[i]) ? '#97470A' : '#55605F';
      return d;
    });
    var mc = { Running: '#2F7D4F', Idle: '#B8B8B2', Down: '#B42318' };
    var machines = [
      ['CNC-01','Machining','Running','SO-[1042]','212','48 s','82%','Spindle 61 °C','—'],
      ['CNC-02','Machining','Running','SO-[1047]','186','51 s','76%','Spindle 58 °C','—'],
      ['CNC-03','Machining','Down','SO-[1042]','64','—','0%','Spindle 92 °C','Overheat · 42 min'],
      ['Laser-01','Cutting','Running','SO-[1055]','340','22 s','88%','Power 4.1 kW','—'],
      ['Press-02','Cutting','Idle','—','0','—','—','—','No material · 25 min'],
      ['Weld-R1','Welding','Running','SO-[1038]','118','95 s','71%','Current 210 A','—'],
      ['Weld-R2','Welding','Down','SO-[1052]','40','—','0%','Wire feed fault','Fault · 15 min'],
      ['Paint-L1','Painting','Running','SO-[1040]','262','—','68%','Oven 180 °C','—']
    ].map(function (m) { return { name: m[0], dept: m[1], state: m[2], order: m[3], count: m[4], cycle: m[5], oee: m[6], sensor: m[7], stop: m[8], color: mc[m[2]] }; });
    return {
      nav: nav,
      depts: depts,
      mcols: ['Machine','Department','State','Running order','Count (shift)','Cycle time','OEE','Key sensor','Last stop'],
      machines: machines
    };
  }
}

dcMount("<div style=\"box-sizing: border-box; min-height: 1240px; display: flex; flex-wrap: wrap; align-items: stretch; background: #F2F6F5; font-family: Inter, system-ui, sans-serif; color: #102A28\">\n\n  <nav aria-label=\"Main\" style=\"flex: 1 1 220px; box-sizing: border-box; background: #0B3B39; padding: 24px 16px; display: flex; flex-direction: column; gap: 4px\">\n    <div style=\"display: flex; align-items: center; gap: 10px; padding: 0 8px 20px\">\n      <div style=\"width: 36px; height: 36px; border-radius: 8px; background: #134E4A; border: 1px dashed #5FA8A0; display: flex; align-items: center; justify-content: center; font-size: 10px; color: #CFE7E3\">LOGO<\/div>\n      <div style=\"display: flex; flex-direction: column; gap: 2px\">\n        <div style=\"font-weight: 700; font-size: 15px; color: #FFFFFF\">Production Tower<\/div>\n        <div style=\"font-size: 11px; color: #9CCFC7\">Powered by itTrident<\/div>\n      <\/div>\n    <\/div>\n    <sc-for list=\"{{nav}}\" as=\"item\" hint-placeholder-count=\"6\">\n      <a href=\"{{item.href}}\" style=\"{{item.style}}\"><svg aria-hidden=\"true\" width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"{{item.icon}}\"><\/path><\/svg><span>{{item.label}}<\/span><\/a>\n    <\/sc-for>\n  <\/nav>\n\n  <main style=\"flex: 999 1 560px; min-width: 0; box-sizing: border-box; padding: 28px 32px; display: flex; flex-direction: column; gap: 20px\">\n    <div style=\"display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; margin: -28px -32px 4px; padding: 12px 32px; background: #FFFFFF; border-bottom: 1px solid #DCE4E3\">\n      <div style=\"display: flex; align-items: center; gap: 8px; flex: 1 1 260px; max-width: 440px; height: 40px; padding: 0 12px; border: 1px solid #DCE4E3; border-radius: 8px; background: #F2F6F5; color: #637170\">\n        <svg aria-hidden=\"true\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\"><path d=\"M11 18a7 7 0 1 0 0-14 7 7 0 0 0 0 14zM21 21l-5-5\"><\/path><\/svg>\n        <input type=\"search\" aria-label=\"Search orders, machines and materials\" placeholder=\"Search orders, machines, materials…\" style=\"flex: 1; min-width: 0; height: 36px; border: 0; background: transparent; font: inherit; font-size: 13px; color: #102A28\">\n      <\/div>\n      <div style=\"display: flex; flex-wrap: wrap; align-items: center; gap: 12px\">\n        <span style=\"font-size: 12px; font-weight: 500; color: #115E59; background: #E6F4F1; border-radius: 999px; padding: 6px 12px\">[Plant name] · Shift B · 14:00–22:00<\/span>\n        <button aria-label=\"Notifications, 5 new\" style=\"position: relative; width: 44px; height: 44px; border-radius: 8px; border: 1px solid #DCE4E3; background: #FFFFFF; color: #33403F; display: flex; align-items: center; justify-content: center; cursor: pointer\">\n          <svg aria-hidden=\"true\" width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9M10.3 21a1.9 1.9 0 0 0 3.4 0\"><\/path><\/svg>\n          <span style=\"position: absolute; top: 5px; right: 5px; min-width: 16px; height: 16px; border-radius: 999px; background: #B42318; color: #FFFFFF; font-size: 10px; font-weight: 700; display: flex; align-items: center; justify-content: center\">5<\/span>\n        <\/button>\n        <div style=\"display: flex; align-items: center; gap: 8px\">\n          <span aria-hidden=\"true\" style=\"width: 36px; height: 36px; border-radius: 50%; background: #0F766E; color: #FFFFFF; font-size: 13px; font-weight: 600; display: flex; align-items: center; justify-content: center\">PH<\/span>\n          <span style=\"display: flex; flex-direction: column; font-size: 12px; line-height: 1.3\"><strong style=\"font-size: 13px; color: #102A28\">[User name]<\/strong><span style=\"color: #637170\">Plant head<\/span><\/span>\n        <\/div>\n      <\/div>\n    <\/div>\n\n\n    <header style=\"display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px\">\n      <div>\n        <div style=\"font-size: 13px; color: #55605F\">Work in progress across departments · Shift B<\/div>\n        <h1 style=\"margin: 4px 0 0; font-size: 26px; font-weight: 700; letter-spacing: -0.01em\">Shop floor &amp; stages<\/h1>\n      <\/div>\n      <div style=\"display: flex; gap: 8px; flex-wrap: wrap; align-items: flex-end\">\n        <label style=\"display: flex; flex-direction: column; font-size: 11px; color: #55605F; gap: 2px\">Shift\n          <select style=\"height: 36px; border: 1px solid #C3CFCD; border-radius: 6px; padding: 0 10px; font: inherit; font-size: 13px; background: #fff\"><option>Shift B (current)<\/option><option>Shift A<\/option><option>Shift C<\/option><\/select>\n        <\/label>\n        <button style=\"height: 44px; padding: 0 16px; border-radius: 6px; border: 1px solid #C3CFCD; background: #fff; font: inherit; font-size: 13px\">TV / Andon mode<\/button>\n      <\/div>\n    <\/header>\n\n    <section aria-label=\"Department board\" style=\"display: flex; gap: 12px; overflow-x: auto; padding-bottom: 6px\">\n      <sc-for list=\"{{depts}}\" as=\"d\" hint-placeholder-count=\"7\">\n        <div style=\"flex: 1 0 200px; background: #fff; border: 1px solid #DCE4E3; border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 10px\">\n          <div style=\"display: flex; justify-content: space-between; align-items: center\">\n            <h2 style=\"margin: 0; font-size: 14px\">{{d.name}}<\/h2>\n            <span style=\"font-size: 11px; font-weight: 600; color: {{d.tone}}\">{{d.flag}}<\/span>\n          <\/div>\n          <div style=\"font-size: 12px; color: #55605F\">Today {{d.actual}} / {{d.target}} units<\/div>\n          <div style=\"height: 6px; background: #EBF0EF; border-radius: 3px\"><div style=\"height: 6px; border-radius: 3px; background: #0F766E; width: {{d.pct}}\"><\/div><\/div>\n          <div style=\"font-size: 12px; color: #55605F\">Operators {{d.ops}} · Machines {{d.mc}}<\/div>\n          <a href=\"process-board.html\" style=\"display: flex; flex-direction: column; gap: 2px; text-decoration: none; color: #102A28; background: #E6F4F1; border-radius: 6px; padding: 8px\">\n            <span style=\"font-size: 11px; color: #33403F\">Shift update · {{d.headTime}}<\/span>\n            <span style=\"font-size: 12px; line-height: 1.4\">{{d.headNote}}<\/span>\n          <\/a>\n          <div style=\"font-size: 12px; color: {{d.handTone}}\">{{d.handoffs}}<\/div>\n          <sc-for list=\"{{d.cards}}\" as=\"c\" hint-placeholder-count=\"2\">\n            <a href=\"order-detail.html\" style=\"display: block; text-decoration: none; color: #102A28; border: 1px solid #DCE4E3; border-radius: 6px; padding: 10px; background: #F8FAFA\">\n              <div style=\"font-size: 13px; font-weight: 600\">{{c.id}}<\/div>\n              <div style=\"font-size: 12px; color: #55605F\">{{c.client}} · {{c.qty}}<\/div>\n              <div style=\"font-size: 11px; color: {{c.tone}}; margin-top: 4px\">{{c.note}}<\/div>\n            <\/a>\n          <\/sc-for>\n        <\/div>\n      <\/sc-for>\n    <\/section>\n    <div style=\"font-size: 11px; color: #637170; margin-top: -10px\">Cards = production orders currently at that operation. Source: SAP PP order status + operation confirmations; targets from daily dispatch plan; shift updates and handoffs from the department head app<\/div>\n\n    <section style=\"background: #fff; border: 1px solid #DCE4E3; border-radius: 12px; padding: 18px; display: flex; flex-direction: column; gap: 12px\">\n      <div style=\"display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px\">\n        <h2 style=\"margin: 0; font-size: 16px\">Machines (IoT)<\/h2>\n        <span style=\"font-size: 12px; color: #637170\">Shown only where machines are connected; otherwise status comes from operator entry<\/span>\n      <\/div>\n      <div style=\"overflow-x: auto\">\n        <table style=\"width: 100%; border-collapse: collapse; font-size: 13px; min-width: 900px\">\n          <thead>\n            <tr style=\"text-align: left; color: #55605F; font-size: 12px\">\n              <sc-for list=\"{{mcols}}\" as=\"h\" hint-placeholder-count=\"9\">\n                <th style=\"padding: 8px; border-bottom: 1px solid #DCE4E3; font-weight: 500; white-space: nowrap\">{{h}}<\/th>\n              <\/sc-for>\n            <\/tr>\n          <\/thead>\n          <tbody>\n            <sc-for list=\"{{machines}}\" as=\"m\" hint-placeholder-count=\"8\">\n              <tr>\n                <td style=\"padding: 10px 8px; border-bottom: 1px solid #EBF0EF; font-weight: 600\">{{m.name}}<\/td>\n                <td style=\"padding: 10px 8px; border-bottom: 1px solid #EBF0EF\">{{m.dept}}<\/td>\n                <td style=\"padding: 10px 8px; border-bottom: 1px solid #EBF0EF\"><span style=\"display: inline-flex; align-items: center; gap: 6px\"><span style=\"width: 10px; height: 10px; border-radius: 50%; background: {{m.color}}\"><\/span>{{m.state}}<\/span><\/td>\n                <td style=\"padding: 10px 8px; border-bottom: 1px solid #EBF0EF\">{{m.order}}<\/td>\n                <td style=\"padding: 10px 8px; border-bottom: 1px solid #EBF0EF\">{{m.count}}<\/td>\n                <td style=\"padding: 10px 8px; border-bottom: 1px solid #EBF0EF\">{{m.cycle}}<\/td>\n                <td style=\"padding: 10px 8px; border-bottom: 1px solid #EBF0EF\">{{m.oee}}<\/td>\n                <td style=\"padding: 10px 8px; border-bottom: 1px solid #EBF0EF\">{{m.sensor}}<\/td>\n                <td style=\"padding: 10px 8px; border-bottom: 1px solid #EBF0EF\">{{m.stop}}<\/td>\n              <\/tr>\n            <\/sc-for>\n          <\/tbody>\n        <\/table>\n      <\/div>\n    <\/section>\n\n    <section style=\"background: #fff; border: 1px dashed #8A9998; border-radius: 12px; padding: 18px; display: flex; flex-wrap: wrap; gap: 16px; align-items: center; justify-content: space-between\">\n      <div style=\"display: flex; flex-direction: column; gap: 4px; max-width: 720px\">\n        <h2 style=\"margin: 0; font-size: 15px\">No IoT on a line? Operator entry fallback<\/h2>\n        <div style=\"font-size: 13px; color: #33403F; line-height: 1.5\">Supervisor logs hourly count, scrap and downtime reason from a tablet; entries post to SAP as confirmations.<\/div>\n      <\/div>\n      <button style=\"height: 44px; padding: 0 16px; border-radius: 6px; border: 0; background: #0F766E; color: #fff; font: inherit; font-size: 13px; font-weight: 600\">Log hourly output<\/button>\n    <\/section>\n    <footer style=\"margin-top: auto; padding-top: 16px; border-top: 1px solid #DCE4E3; font-size: 12px; color: #55605F\">Powered by <strong style=\"color: #102A28\">itTrident<\/strong><\/footer>\n  <\/main>\n<\/div>", Component, document.getElementById('root'));
</script>
